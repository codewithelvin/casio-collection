# BG-202B -- seeded 2026-08-31 from Casiold (casiold.com), a UK dealer in
# vintage Casio. That is a `retailer` source and is labelled as one (FR-D1).
#
# In neither of the two rosters this project normally asks, and in none of
# the 853 entries of the Digital Watch Library's Casio gallery either. That
# is what a pre-web Casio looks like -- too old for casio.com, not yet
# written up by DWL -- and not evidence that it is not real. The evidence
# is the dealer's own photograph of the watch.
#
# ONLY THE REFERENCE IS WRITTEN DOWN, and each absence is deliberate:
#   * no `year`. casiold's titles are dated -- "1984 Casio AE-10" -- and the
#     date is the dealer's own. Against the 17 references this catalogue
#     already held where casiold also has a listing, it disagrees on 5, and on
#     DBC-610 it is out by six years: casiold says 1991 where the Digital Watch
#     Library page this catalogue cites states RELEASED | 1985. A dealer dates
#     the example in front of him. D25 and D54 want a page that states the
#     year, and a listing title is not one.
#   * no specifications. The listing body is condition prose -- "all works
#     great ... has got a bleed to the screen" -- and not a table, so D50's
#     four-row floor is not met.
#   * no `discontinued`. Never written by hand (D59); availability.ts measures it.
#
# See the casiold section of
# .claude/skills/casio-catalog/references/sources.md for the whole finding.
#
# NO PHOTOGRAPH. Every image on this listing is of the box or of the watch
# sealed in its blister pack, so there is nothing that shows the watch. A
# model with no image is withheld from browsing, which is the honest state
# here rather than a card showing a cardboard box.

