# BGD-565 — seeded 2026-08-17 (M9).
#
# THE ROSTER IS CASIO'S OWN SITEMAP, which is what closed O11. casio.com's
# product pages answer 403 and its AEM paths return the location picker, but
# `casio.com/<locale>/sitemap.xml` answers 200 and lists every product URL with
# the reference in the path:
#   https://www.casio.com/us/watches/edifice/product.EFR-527D-1AV/
# So "which references exist" is Casio saying so, where G-SHOCK's roster is a
# community index saying the same thing. It is still provenance for a model's
# IDENTITY only — the sitemap states no specifications.
#
# THE FIELDS ARE THE MODULE GUIDE (D44), named in `source`, read off its
# Specifications table. WHICH MODULE a series runs is the one link neither source
# provides: that comes from casiofanmag's per-line table, a community source that
# says of itself that it cannot guarantee accuracy. It is used exactly as
# ShockBase is — identity, never fields.
#
# So three sources, and the split is deliberate: Casio for what exists, a
# community table for which guide to open, and Casio's guide for every value
# written. A reader clicking `source` lands on the page every field came from,
# which is what §10.6's one-page rule is for.
#
# THE PHOTOGRAPHS COME FROM A DIFFERENT CASIO PAGE, and each one says so (D53).
# Every *field* above is still read off the module manual named in `source`;
# the photograph is read off Casio's own archived product page for that exact
# reference (D52), which is what `image_credit.url` points at. The file itself
# is served live by casio.com from the `/content/dam/` path that page names —
# never a path derived from the reference, which is the whole of D41.
#
# SIX OF THEM CAME FROM SOMEWHERE ELSE, and `image_credit.url` is the only place
# that can say so, so read it rather than assuming Casio. BGD-565GC-2/-4/-7 and
# BGD-565SC-1/-2B/-4B have no archived product page in any of the 29 locales, nor
# under Casio's general `casio` segment: the SC trio launched in Japan in March
# 2026 and the archive has not caught up with either. Their photographs come from
# the CASIO Flagship Store Indonesia listing — Casio's own distributor there —
# used under D11. The GC three are transparent 2000 px files; the SC three were
# on a white plate and were cut out (see below).
#
# THE WHITE PLATE IS GONE FROM THE SC THREE, flood-filled from the border so that
# only white CONNECTED to the edge is removed and the fill stops at the case
# outline. All three are white watches, which is exactly the case a colour key
# would have erased.
#
# BGD-565KT-7 KEPT ITS WHITE PLATE, deliberately and against the rest of this
# file. Casio published it as a white-ground PNG with no alpha — identical bytes
# in the `de`, `us` and `jp` copies — and the asset carries Sanrio's copyright
# notice along its bottom edge. Cutting the plate out leaves that notice black on
# a dark card, where it cannot be read. A licence notice that has to be legible
# outranks a consistent background.
#
# EVERY ENTRY HERE NOW HAS A PHOTOGRAPH. That is worth stating because it was not
# true before and is not the natural state of this catalogue: the typographic card
# remains a primary state rather than a fallback (D29).
#
# DELIBERATELY NOT WRITTEN:
#   * `year` — the guide dates the module, never the reference (D25).
#   * `case`, `water_resistance_m`, `colorway` — the guide is about the module.

