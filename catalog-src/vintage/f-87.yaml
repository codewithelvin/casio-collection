# F-87 — seeded 2026-08-16 (M1c, the sourcing spike).
#
# One model, read off one page in the Digital Watch Library. That is a
# community source and is labelled as one: casio.com answers 403 to anything
# that is not a person, so no official page was available to prefer.
#
# Movement is absent because the page does not state one, and display is absent
# unless the page describes the dial. The page shows a "light" icon with no
# type, and the vocabulary has five specific light values and no generic one,
# so no light feature is claimed. Absent means nobody has found it (D27).
#
# PHOTOGRAPH ADDED 2026-08-31, and it comes from a different page than every
# field above: Casiold (casiold.com), a UK dealer, listing this reference
# new-old-stock. The credit travels with the file (D41), which is what lets
# one entry cite two pages honestly -- the specifications are still the DWL
# page in `source` and nothing was re-read from the dealer. The listing
# photographs the watch beside Casio's own hang tag, and the tag prints
# F-87, so the photograph identifies itself.

