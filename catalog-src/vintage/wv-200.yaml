# WV-200 — seeded 2026-08-25 from Casio's own
# product pages, retrieved from the Internet Archive (D52). Every field on every
# entry below, and every photograph, comes from the one page named in its
# `source`.
#
# Where an entry carries a `year`, it came from a **different** Casio page — the
# dated news release named in `year_source` (D54) — because a product page dates
# nothing (D25) and a news release states no specifications (D50). Neither page
# is asked for what the other says.
#
# DELIBERATELY NOT WRITTEN:
#   * any field the page does not state. Absent means unknown, never zero (D27).
#
# `family: wave-ceptor` was proposed by the seeding run and written by the client
# on 2026-08-25, which is the order guardrail 4a asks for — a family is a human's
# judgement and never a side effect of a crawl. It is a well-supported one: WV is
# Casio's own abbreviation for Wave Ceptor, the family already exists in
# `lines.yaml` holding LCW-M100 and WVA-M630, and **every entry below carries
# `radio-controlled`**, read off its own product page rather than off the prefix.
# That last part is what makes it a reading rather than a guess about the name.

