      author: Casio Computer Co., Ltd.
      licence: rights-reserved
      url: 'https://web.archive.org/web/20250406075538id_/https://www.casio.com/in/watches/casio/product.A159W-N1/'
    discontinued: false
  - id: a159wa-n1
    ref: A159WA-N1
    source:
      { url: 'https://web.archive.org/web/20250523170640id_/https://www.casio.com/sg/watches/casio/product.A159WA-N1/', kind: official }
    movement: quartz
    case: { height_mm: 36.8, width_mm: 33.2, depth_mm: 8.2, weight_g: 44, material: 'Resin / Chrome plated' }
