# ADDED 2026-08-26: A159WEVJ-7, the one reference in this series whose source is
# NEITHER Casio nor the archive — and the reason is that it is too new, not too
# obscure.
#
# The survey has been calling this NO-PAGE, which was accurate and read as a dead
# end: Casio's own current sitemap carries `product.A159WEVJ-7/`, and a
# domain-wide CDX query over casio.com for the whole `A159` prefix returned 46
# captures across five references and not one of them this. That looks like the
# shape of a watch nobody can source. It is the opposite. The A159WEVJ pair was
# released in **April 2026**, four months ago; the archive has no capture because
# it has not been round yet, and casio.com answers 403 to everything that is not
# a person — every locale of the product page, the `a159wevj` family page, and
# the Japanese path, all measured today.
#
# So the routes were walked in the order the skill sets out, and the fourth one
# answered. `casio.com/intl/news/` was read in full (D54): 60-odd dated releases
# through 2026-07-21, and no A159WEVJ among them, so there is no news release to
# date this from. The Digital Watch Library hangs on every A159 slug — proven
# against an interleaved control, `casio-a168`, which answered 200 in 7 s in the
# same run at the same pace. What is left is a shop, and one that prints a
# specification table rather than a paragraph.
#
# WHAT IS NOT WRITTEN, and each for a stated reason:
#   * `water_resistance_m` — the page says "Water Resistant" and no figure. A
#     community write-up says 30 m; that is a different page, and one page per
#     model is the rule that stops a spec table being assembled out of three
#     sites. The four entries above carry no figure either.
#   * `year` — nothing readable states one. April 2026 is well reported, but by
#     the blogs rather than by this entry's source, and D25 does not care how
#     confident the inference is.
#   * `module` — not stated, and never guessed from a neighbour.
#   * `discontinued` — measured for the whole catalogue by `availability.ts`
#     (D59), never written by hand.
#
# `display: digital` is the one field here its siblings lack, and it is not an
# inference: "Casio Standard digital" is the source page's own product name. The
# others were read by a mechanical reader off pages that print no display row.
#
# The photograph is Casio's own product render, taken from the same page as every
# field — `A159WEVJ_7.jpg`, the reference with a boundary after it. It is 600 px
# wide, so `catalog:images` warns that the 2x file is not really 2x and it is
# right: the 400 px render is true and the retina one is upscaled. Above the
# 300 px floor, inside budget, and a larger original is worth taking if one turns
# up. Credited to the shop under D11, as the WatchOutz entries in the G-SHOCK
# files are.
  - id: a159wevj-7
    ref: A159WEVJ-7
    source:
      { url: 'https://www.timekeepershop.com/en/product/193942-202048/a159wevj-7', kind: retailer }
    display: digital
    movement: quartz
    case: { height_mm: 36.8, width_mm: 33.2, depth_mm: 8.5, weight_g: 45, material: 'Resin / Chrome plated' }
    features: [alarm, stopwatch, calendar, hourly-time-signal, led-light]
    image: a159wevj-7
    image_credit:
      author: Timekeeper Shop
      licence: rights-reserved
      url: 'https://www.timekeepershop.com/en/product/193942-202048/a159wevj-7'
    discontinued: false

# ADDED 2026-08-26: A159WEVJ-2, the indigo half of the pair, and **the thinner of
# the two entries on purpose.**
#
# Same reference class and same reason it was NO-PAGE: released April 2026, zero
# captures in a domain-wide CDX query, and casio.com 403 at every locale — the
# UK store the press points at is `casio.co.uk`, which redirects to
# `casio.com/uk/` and 403s like the rest. So a shop again.
#
# **The shop is a different one, and the choice was between two kinds of poorer.**
# `timekeepershop.com` carries the -7 and does not list this reference at all, so
# the sibling's page was not an option. Four candidates were read and none of them
# is as complete as the -7's page:
#
#   * IPPO JAPAN WATCH prints Casio's own figures — 36.8x33.2x8.5 mm, 45 g — and
#     the display type, and it holds the photograph. No material, no functions.
#   * notebookcheck.net states the material and the whole function list, and no
#     dimensions or weight at all.
#   * ormoda.com states dimensions rounded to 33/33/8 with a "lug to lug" of 36,
#     which is a normalised template rather than Casio's rows, and getting a case
#     0.8 mm wrong is worse than leaving it unknown.
#   * sakurawatches.com is the interesting one and was still refused: it prints
#     `593` as the module, which would be the most valuable field here. Its table
#     also calls the calendar "Perpetual" and the stopwatch a "Chronograph", and
#     the A159's calendar is auto-set at 28 days for February and is not
#     perpetual. A table with a demonstrable error in it is not a source for a
#     field nothing else states.
#
# IPPO won because one page had to carry both the specification and the picture,
# and it is the only one that does. **The consequence is written down rather than
# hidden: this entry has no `features`, no `movement` and no `case.material`, and
# its sibling directly above has all three.** Each of those facts exists on a page
# named in this comment; none of them is on the page in `source`, and one page per
# model is what stops a spec table being assembled out of four sites. Anyone with
# a browser can open the Casio page and close every one of these gaps at once.
#
# THE PHOTOGRAPH IS THE ONE JUDGEMENT CALL HERE. IPPO names its files
# `100000001009800864_10204.jpg`, so the filename test cannot be run and the lead
# image is evidence rather than proof — which is exactly the case the skill says
# to look at rather than trust. It is the right watch: a **blue** seigaiha wave
# dial on a silver bracelet, and the blue wave dial belongs to this reference
# alone in the whole series — the only other seigaiha is the -7 above, which is
# grey, and no other A159 has a pattern at all. Same Casio product render as the
# -7, same 10:58 50, same white ground. 600 px, so the 2x is upscaled again.
#
# The `ref` is `A159WEVJ-2` where the source page says `A159WEVJ-2JR`, and that is
# not a discrepancy: `JR` is the Japanese market code, pure letters after the
# reference, and Casio's own sitemap carries `product.A159WEVJ-2/`. The same watch
# is sold as `-2ER` in Europe. Matching on the reference plus a pure-letter code
# is the rule; a substring match is what would let a `-2B1DR` answer for a `-2`.
  - id: a159wevj-2
    ref: A159WEVJ-2
    source:
      { url: 'https://www.ippojapanwatch.com/products/casio-a159wevj-2jr-classic-digital-watch-blue-led-display-water-resistant-adjustable-stainless-steel-band', kind: retailer }
    display: digital
    case: { height_mm: 36.8, width_mm: 33.2, depth_mm: 8.5, weight_g: 45 }
    image: a159wevj-2
    image_credit:
      author: IPPO JAPAN WATCH
      licence: rights-reserved
      url: 'https://www.ippojapanwatch.com/products/casio-a159wevj-2jr-classic-digital-watch-blue-led-display-water-resistant-adjustable-stainless-steel-band'
    discontinued: false
