# T-2000 — seeded 2026-08-16 (M1c, the sourcing spike).
#
# One model, read off one page in the Digital Watch Library. That is a
# community source and is labelled as one: casio.com answers 403 to anything
# that is not a person, so no official page was available to prefer.
#
# Movement is absent because the page does not state one, and display is absent
# unless the page describes the dial. The page shows a "light" icon with no
# type, and the vocabulary has five specific light values and no generic one,
# so no light feature is claimed. Absent means nobody has found it (D27).
#
# `year` came from a SECOND page, added 2026-08-21 by /finish-casio 1976-1990.
# The Digital Watch Library holds two pages for this watch: the one in `source`,
# `casio-t-2000`, a blue example whose RELEASED field reads UNKNOWN, and
# `casio-t-2000-dictionary`, which states 1984. Both title the watch T-2000, both
# give its AKA as Dictionary, and both state module 219 and band B-332N, which is
# what makes them the same reference. They DISAGREE on case material — `source`
# says stainless steel, the second page says chrome plated base-metal — so
# `case` was left exactly as `source` states it and only the year was taken. That
# disagreement is reported rather than resolved (§10.6); it is the one thing on
# this entry a reviewer should look at.

series:
  id: t-2000
  name: T-2000
  line: vintage
  aka: ['Dictionary']

models:
  - id: t-2000
    ref: T-2000
    source: { url: 'http://www.digital-watch.com/DWL/1work/casio-t-2000', kind: community }
    module: '219'
    case: { material: stainless steel }
    features: [alarm, stopwatch, dual-time]
    image: t-2000
    image_credit:
      author: The Digital Watch Library
      licence: rights-reserved
      url: 'http://www.digital-watch.com/DWL/1work/casio-t-2000'
    year: 1984
    year_source: 'http://www.digital-watch.com/DWL/1work/casio-t-2000-dictionary'
    discontinued: true
