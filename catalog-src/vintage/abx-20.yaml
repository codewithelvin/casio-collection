# ABX-20 — seeded 2026-08-16 (M1c, the sourcing spike).
#
# One model, read off one page in the Digital Watch Library. That is a
# community source and is labelled as one: casio.com answers 403 to anything
# that is not a person, so no official page was available to prefer.
#
# Movement is absent because the page does not state one, and display is absent
# unless the page describes the dial. The page shows a "light" icon with no
# type, and the vocabulary has five specific light values and no generic one,
# so no light feature is claimed. Absent means nobody has found it (D27).
#
# `family: databank` added 2026-08-19. This was the only Databank-shaped series
# in the catalogue for three days, and a family of one does not render as a
# heading (D32, check 4) — so tagging it then would have bought a warning and
# nothing else. DB-360, DBC-32 and DBC-611 arrived from Casio's archived product
# pages, and the family now has four series and a reason to exist.

series:
  id: abx-20
  name: ABX-20
  line: vintage
  family: databank
  aka: ['TwinCept', 'TwinCept Databank']

models:
  - id: abx-20
    ref: ABX-20
    source: { url: 'http://www.digital-watch.com/DWL/1work/casio-abx-20', kind: community }
    display: ana-digi
    module: '1349'
    case: { material: resin }
    water_resistance_m: 50
    features: [alarm, stopwatch, dual-time, databank]
    image: abx-20
    image_credit:
      author: The Digital Watch Library
      licence: rights-reserved
      url: 'http://www.digital-watch.com/DWL/1work/casio-abx-20'
    discontinued: true
