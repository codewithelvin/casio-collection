    # THE REFUSAL THAT STOOD HERE WAS WRONG, and it was wrong about the tool
    # rather than about the watch. It read: *"the one archived capture of this
    # reference's page names no photograph — `photos.ts` found 3 asset URLs
    # across the 4 entries here, and this is the one without."* True of what the
    # reader could see and false of the page: `imageUrl`'s `stemOf` required a
    # bare `/assets/`, and Casio's US locale files this reference's assets under
    # `us-assets/`, so every candidate was discarded in silence (D81, 2026-09-08).
