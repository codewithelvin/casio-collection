# W-735 — seeded 2026-09-08 from Casio's own
# product pages, retrieved from the Internet Archive (D52). Every field on every
# entry below, and every photograph, comes from the one page named in its
# `source`.
#
# Where an entry carries a `year`, it came from a **different** Casio page — the
# dated news release named in `year_source` (D54) — because a product page dates
# nothing (D25) and a news release states no specifications (D50). Neither page
# is asked for what the other says.
#
# FIVE OF THESE PHOTOGRAPHS WERE ADDED BY HAND, off the same page as `source`.
# `seed-into.ts` wrote 1A2V, 1A3V, 1AV, 2AV and 8AV with no `image`, and their
# pages do name one: the US locale files its assets under `us-assets/`, and
# `imageUrl`'s `stemOf` matches `/assets/` with a leading slash, so every
# candidate on a us/en capture is discarded and the function returns null. A page
# that names a photograph read as a page that names none, with nothing going red.
# The five URLs were copied verbatim off each reference's own page — nothing
# derived, which is the rule the A159WA-N1 byte-identical-file trap exists for —
# and each filename carries its own reference. Reported, not fixed: `archive.ts`
# is not a file a catalogue run may write (rule 5).
#
# DELIBERATELY NOT WRITTEN:
#   * `family` — a judgement about how a watch looks, and a human's to make.
#   * any field the page does not state. Absent means unknown, never zero (D27).
#   * `vibration-alarm` — nothing. All nine entries carry it, every one of them
#     off the page named in its own `source`, and the history of that sentence is
#     worth keeping because it was wrong twice in two days.
#
#     IT FIRST READ: "which every one of these watches prints on its bezel in
#     the photograph. The product page's own function list does not state it, and
#     a feature read off a picture is a guess with a citation attached." That is
#     why D83 refused it on 2026-09-08, while naming the price as payable "until
#     a page states it in words".
#
#     THEN IT SAID THE LIVE PAGE STATES IT AND THE ARCHIVE DOES NOT, so seven
#     entries were given the feature with a **`features_source`** (D84) pointing
#     at a live casio.com URL that answers 403 here and 200 to a person, and two
#     entries — `1A` and `8A`, sourced to `/jp/` captures — were left without it
#     because nobody here reads Japanese page furniture. That is the paragraph
#     this one replaces, and its central claim was false.
#
#     **EVERY ONE OF THE NINE CAPTURES THIS FILE ALREADY CITED STATES IT IN
#     WORDS.** Measured 2026-09-08 by fetching all nine `source` URLs and
#     searching each for Casio's own vocabulary rather than for one phrase:
#
#       * the seven English pages print **"Vibe alert"** in the *Other features*
#         row — `Vibe alert (daily alarm, hourly time signal, countdown timer
#         time up, stopwatch auto start countdown)` — and four of them *also*
#         print "Vibration alarm" in the highlights bullets above it;
#       * the two `/jp/` pages print **バイブレーション機能** in 時計機能, and
#         they do not state "no functions at all" — the 2025 captures carry a
#         complete spec table. `1A` and `8A` are now re-pointed at those, and
#         they gained the whole eleven-value list plus a case material.
#
#     WHY IT WAS MISSED, WHICH IS THE ONLY PART WORTH REMEMBERING. The search was
#     for the words the *client's* transcription used. Casio writes the same
#     feature two ways on the same page — "Vibration alarm" as marketing copy,
#     "Vibe alert" in the specification table — and the older captures carry only
#     the second. A grep for `Vibrat` therefore came back empty on pages whose
#     own feature table names the feature, and empty read as absent. **One tag's
#     difference returns zero rows rather than an error**, and this is that rule
#     wearing a synonym instead of a carriage return: the same false negative
#     shape as `image: null` and as `us-assets/`. When a page is supposed to
#     state something and reads silent, ask it in the vendor's words before
#     concluding anything about the page.
#
#     SO `features_source` IS GONE FROM ALL SEVEN and no entry in this file has
#     one. A citation is worth having when it points somewhere a reviewer can go;
#     pointing at a 403 for a fact the cited archived page states in words was
#     strictly worse than citing the page already named. D84's schema field is
#     untouched and still means what it says — this file is simply no longer an
#     example of needing it, and the client should know that it now has no users.

