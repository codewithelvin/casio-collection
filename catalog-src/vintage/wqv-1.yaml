# WQV-1 — the Wrist Camera, the first wristwatch with a digital camera in it,
# added 2026-08-27 from Casio's own 50th-anniversary Heritage timeline. Year,
# specification and photograph all come off that one official page, so there is
# no second source and no `year_source`.
#
# NEITHER ROSTER KNOWS THE REFERENCE, and that was measured rather than assumed:
# it is absent from all 4,615 references in Casio's current sitemap (us, intl,
# de), and the archive holds no `product.WQV-1*` capture under any line path. The
# Heritage timeline is a third casio.com surface both rosters are blind to by
# construction — they ask about product pages, and this is not one.
#
# THE PHOTOGRAPH IS A CROP, WHICH NO OTHER ENTRY IN THIS CATALOGUE IS, so the
# reasoning is here rather than in a commit message. The asset Casio renders in
# this tile — `2000-wqv-1-wqv-10-sq.png` — is a 900 x 900 frame holding TWO
# watches: the WQV-1 large on the left, and a smaller one on the right with
# `[2001] WQV-10` set beside it in type. A frame with two watches and burned-in
# captions is the "listing collage" §10.3 refuses, so it is not publishable as
# it stands. The left watch was cut out of it on its own alpha bounds (columns
# 79-509, rows 106-837) and padded back to square on transparent ground, which
# is what the other seven assets on this page already are.
#
# WHICH WATCH IS WHICH IS NOT A GUESS. Three things agree: the tile's title is
# WQV-1, Casio's own caption names the OTHER watch WQV-10, and the prose
# distinguishes them by display — "Following the WQV-1 with black-and-white
# photo/display, in 2001, Casio released the WQV-10 with a digital zoom function
# and color photo/display". The watch published here has a monochrome LCD; the
# captioned one's is in colour.
#
# THE CROP IS 748 px WIDE, so `catalog:images` will say the 2x file is not really
# 2x. That is true and is the price of the only picture of this watch Casio
# publishes. It clears §10.3's 300 px floor comfortably.
#
# WHAT THE PHOTOGRAPH STATES. Casio's product shot is part of the page cited, so
# a FULL WORD printed on the case is a statement the source makes. This one
# prints CASIO, WATER RESIST, Wrist Camera, SHUTTER, IR BEAM, ADJUST/SET,
# MODE/SELECT, FORWARD, INFO/EFFECT and REVERSE.
#
# ABSENT AND WHY:
#   water_resistance_m   WATER RESIST is printed with NO DEPTH beside it, and the
#                        prose gives none. A number here would be invented.
#   features             THE VOCABULARY HAS NOTHING FOR EITHER OF THIS WATCH'S
#                        TWO REASONS TO EXIST. There is no value for a camera —
#                        the whole point of the model — and none for the infrared
#                        link SHUTTER/IR BEAM names, which is the second time
#                        that gap has been reported (HBX-100, 1997). Both are
#                        proposed in the session summary, not written here
#                        (guardrail 4).
#   movement, module     the page states neither.
#   case                 the picture shows a steel case and bracelet; no material
#                        is named on the page, and the picture is the picture.
#   discontinued         never written by hand — availability.ts measures it (D59).

series:
  id: wqv-1
  name: WQV-1
  line: vintage
  # Casio's own name for it, printed on the case and used throughout the prose.
  aka: [Wrist Camera]

models:
  - id: wqv-1
    # ref-exception: the line's `ref_pattern` wants two to five digits after the
    # prefix letters and this reference has one, WQV-1. Casio numbered it that way
    # in 2000; the pattern is derived from references that exist and is a warning
    # by design, so the exception is acknowledged here rather than the rule
    # widened — the same reading AN-8 and PRT-1GPJ already carry.
    ref: WQV-1
    source: { url: 'https://web.archive.org/web/20240722022708id_/https://www.casio.com/intl/watches/50th/Heritage/2000s/', kind: official }
    year: 2000
    display: digital
    # Cut from the `<img src>` this page renders, which live casio.com still
    # serves at 900 x 900 even though the page itself answers 403. See the note
    # above for why this one is a crop.
    image: wqv-1
    image_credit:
      author: Casio Computer Co., Ltd.
      licence: rights-reserved
      url: 'https://web.archive.org/web/20240722022708id_/https://www.casio.com/intl/watches/50th/Heritage/2000s/'
    discontinued: true
