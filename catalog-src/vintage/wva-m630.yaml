# WVA-M630 — seeded 2026-08-20 from Casio's own
# product pages, retrieved from the Internet Archive (D52). Every field on every
# entry below, and every photograph, comes from the one page named in its
# `source`.
#
# Where an entry carries a `year`, it came from a **different** Casio page — the
# dated news release named in `year_source` (D54) — because a product page dates
# nothing (D25) and a news release states no specifications (D50). Neither page
# is asked for what the other says.
#
# REFRESHED 2026-08-22. All twelve entries gained `movement`, `case.material` and
# `features` off the pages they already cited. Every capture in this series is
# Japanese and the reader takes `ケースサイズ` and `防水性` but not
# `ケース・ベゼル材質`, `時刻修正`, `使用電源` or any of the 時計機能 rows — so
# twelve entries stated a size and a water resistance and nothing about a watch
# whose entire point is that it sets itself.
#
# THIS IS A WAVE CEPTOR, and unlike most collection names that one is checkable
# from both directions: Casio's sitemap has `/us/watches/casio/waveceptor/` and
# `/de/...`, and all twelve of these pages link to `watches/casio/waveceptor/`
# and print "wave ceptor" in prose. Note that `productSeries` does NOT say it —
# it says `Solar combination` — so that field is Casio's own taxonomy and not
# reliably the collection name. It gave `CASIOTRON` and `SPORTS GEAR` elsewhere
# and `Digital` for HDD-600; here the link is the evidence and the field is not.
#
# `movement: solar-radio` rather than `solar`, because each page states both
# halves: `使用電源・電池寿命 タフソーラー（ソーラー充電システム）` and
# `時刻修正 電波時計 日本・北米・ヨーロッパ・中国地域対応 MULTIBAND6`. The two
# also appear as `tough-solar` and `radio-controlled` in `features`, which is the
# same fact in the two places the schema keeps it.
#
# The variants really do differ, and the per-reference values prove the readings
# are not one page's data repeated: the resin-band B is 34.7 g, the steel-band D
# is 92 g, the L is 33 g, and the titanium TDE is 68 g and 11.1 mm deep against
# 11 mm for the rest — the only two entries here whose material is not steel.
#
# DELIBERATELY NOT WRITTEN:
#   * `family` — a judgement about how a watch looks, and a human's to make.
#   * `module` — no row on any of the twelve states one.
#   * the glass and ネオブライト. Every page states `樹脂ガラス` — resin glass —
#     and `FEATURES` has `mineral-glass` and `sapphire-crystal` and no term for
#     resin; Neobrite is a Casio lume with no term either. Both are stated and
#     neither is writable, which is guardrail 4 working rather than a gap.
#   * `display`. These are ana-digi combination watches by every photograph, and
#     no specification row says so, so it stays absent (D25 applies to every
#     field, not only `year`).
#   * any field the page does not state. Absent means unknown, never zero (D27).

