# F-30 — seeded 2026-08-16 (M1c, the sourcing spike).
#
# One model, read off one page in the Digital Watch Library. That is a
# community source and is labelled as one: casio.com answers 403 to anything
# that is not a person, so no official page was available to prefer.
#
# Movement is absent because the page does not state one, and display is absent
# unless the page describes the dial. The page shows a "light" icon with no
# type, and the vocabulary has five specific light values and no generic one,
# so no light feature is claimed. Absent means nobody has found it (D27).

series:
  id: f-30
  name: F-30
  line: vintage

models:
  - id: f-30
    ref: F-30
    source: { url: 'http://www.digital-watch.com/DWL/1work/casio_f-30', kind: community }
    year: 1993
    module: '1007'
    case: { material: resin }
    # A well-used example rather than a press shot, which is what a freely
    # licensed photograph of a 1993 watch looks like. It is the right reference
    # — the dial says F-30 — and it is the only free photograph of one that
    # exists. The scratches are not a defect in the catalogue (D41).
    image: f-30
    image_credit:
      author: Monoklon
      licence: cc-by-sa-4.0
      url: 'https://commons.wikimedia.org/wiki/File:Casio_F-30.jpg'
    discontinued: true
