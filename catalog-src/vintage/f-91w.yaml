    year: 1989
    display: digital
    movement: quartz
    module: '593'
    case: { material: resin, weight_g: 21 }
    water_resistance_m: 30
    features: [alarm, hourly-time-signal, stopwatch, full-auto-calendar]
    colorway: Black with blue accent ring
