        kind: community,
      }
    year: 1989
    display: digital
    movement: quartz
    module: '593'
    case: { material: resin, weight_g: 21 }
    water_resistance_m: 30
    features: [alarm, hourly-time-signal, stopwatch, full-auto-calendar]
    colorway: Black with blue accent ring
    # The photograph matches this entry and not merely this series: the blue
    # accent ring in the picture is the colourway recorded on the line above,
    # which is what makes attaching it to -1 rather than to any of the other
    # seventeen a reading rather than a guess (§10.6 guardrail 2).
