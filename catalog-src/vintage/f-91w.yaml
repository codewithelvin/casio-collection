# F-91W — the first series in the catalogue, seeded 2026-08-16 (M1b/M1c).
#
# Every model here is sourced from one page, casiorestore.com's technical-data
# article, which carries the specification block and a dated variant table. That
# is a `community` source and is labelled as one: casio.com is unreachable from
# the machine this was seeded on (Akamai answers 403 to anything that is not a
# person), so there was no official page to prefer. The reader is told which it
# was, which is the whole point of FR-D1.
#
# Two things were deliberately NOT written, and they are worth naming because
# both would have looked perfectly reasonable in a diff:
#
#   * No backlight feature. The source says "EL backlight"; two other sources
#     read while cross-checking this series call it a micro-light and a "dim
#     green backlight", which is a different part. When sources disagree about a
#     fact, absent is the honest answer (principle 4) — and `el-backlight` on
#     eighteen models would have been eighteen wrong facts, findable by filter.
#   * No `discontinued` flag. The article says production is ongoing for the
#     line, not for each variant, and the WC and WM colourways are plainly no
#     longer sold. Nobody has checked variant by variant, so nobody claims it.
#
# The year on a WC, WM or WS entry is the year the source gives for that group,
# not a guess from the reference code.

series:
  id: f-91w
  name: F-91W
  line: vintage
  aka: [F91W]

models:
  # --- The classic black versions -----------------------------------------
  - id: f-91w-1
    ref: F-91W-1
    source:
