    display: analog
    movement: quartz
    case: { height_mm: 31.2, width_mm: 25.2, depth_mm: 7.5, weight_g: 11, material: 'Resin' }
    image: lq-139amv-1
    image_credit:
      author: Casio Computer Co., Ltd.
      licence: rights-reserved
      url: 'https://web.archive.org/web/20220526115730id_/https://www.casio.com/sg/watches/casio/product.LQ-139AMV-1/'
    discontinued: false
