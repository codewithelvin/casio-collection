# BM-200 — seeded 2026-09-08 from the D22 queue: a visitor reported it as
# missing ("Retro barometer watch") and supplied the page below.
#
# BOTH WEB ROSTERS ANSWER NOTHING, which is the normal condition for a 1992
# Casio: the archive index holds what casio.com published a page for and the
# sitemap holds what Casio sells now. It is not in The Digital Watch Library's
# Casio gallery either (853 slugs, walked 2026-09-08) and not at any canonical
# slug form there — every `casio-bm-200` / `casio_bm200` variant hung to a 25 s
# timeout while `casio_fs-12` and `casio-a168`, interleaved in the same run at
# the same pace, answered 200 in under five seconds. `casiold.com`'s 227
# listings do not have it.
#
# So the source is Vintage Casio Restore, which is `community` — a restorer's
# documentation project, and the only page anybody has found that states this
# watch's module and functions. It sits beside BM-100, BM-600 and BM-610 in this
# catalogue, all three of which were written from community pages too.
#
# NO YEAR, AND THE PAGE IS THE REASON. It says "released around 1992",
# "approx. 1991–1992" and gives one example's make date of 8 January 1992. Every
# one of those is a circa or a date for a watch rather than for a reference, and
# D25 refuses a circa year outright — `null` is the honest value, not 1992.
#
# TWO COLOUR VARIANTS, ONE REFERENCE. The page documents an orange-buttoned
# version whose bezel reads WATER 100M RESIST and a rarer black-buttoned one
# reading WATER 10BAR RESIST, and names no reference for either. Both are BM-200
# as far as any page here states, so this is one entry — the same call already
# made for BM-600 and BM-610.
#
# THE REFERENCES BEHIND THAT ONE ENTRY ARE NOW KNOWN, AND THE ID STAYS AS IT IS.
# Investigated 2026-09-08 at the client's request, because `casiopart.com` names
# **`BM200W-1V`, `-3V` and `-8V`** — a `W` this id does not carry — and that
# looked at first like a permanent id (D2) recording a reference Casio never
# used, which would call for a tombstone rather than a rename. It does not:
#
#   * **The module matches exactly.** casiopart files all three under module
#     **983**, which is what `casiorestore.com` states here, read independently
#     and months apart. Two unrelated sources agreeing on 983 is what settles
#     that these are this watch rather than a near neighbour.
#   * **The short form is this catalogue's established pattern, not a slip.**
#     casiopart also names `BM600-1V` and `BM610-1V` at module **1284**, and this
#     folder holds those as plain `BM-600` and `BM-610` at 1284 too. `LW-80`,
#     `LW-101`, `W-81`, `MTD-1008` and `LW-22H` are all the same shape: a pre-web
#     Casio whose source names the family without a colourway suffix.
#   * So `bm-200` is a family reference with three colourways under it — which is
#     what the paragraph above already said — and the colourways now have names.
#     **If a page ever states `BM-200W-1V`, `-3V` or `-8V`, it is this watch and
#     not a new one.** Recorded for the same reason `w-86.yaml` records its `QES`
#     reasoning: so a future session does not seed a duplicate.
#
# WHERE THE `W` BELONGS IS NOT CONSISTENT ACROSS THE FAMILY, so do not
# generalise it: BM-100 and BM-200 carry it, BM-600 and BM-610 do not. And
# casiopart separates **`BM100W-1V` at module 510 from `BM100WJ-1V` at module
# 560** — two different watches, and this catalogue holds the `WJ` at 560,
# correctly. In this family a `W`/`WJ` difference is a module difference, so it
# is never cosmetic.
#
# TWO OF ITS FEATURES DID NOT EXIST WHEN IT WAS FIRST WRITTEN. `acrylic-crystal`
# and `ascent-descent-speed` were reported by the seeding run and written
# nowhere, because rule 4 forbids a vocabulary growing as a side effect. **The
# client added both on 2026-09-08 (O19), in their own commit**, and this is the
# entry that asked for them: `ascent-descent-speed` is the one thing Casio
# changed between the BM-100 and this watch, and describing it as an altimeter
# would have lost the reason the model exists. Both ship as singletons and the
# reasons are on the record beside the values.
#
# DELIBERATELY NOT WRITTEN:
#   * `movement`. Battery-driven digital, and the page never says quartz.
#   * case dimensions. The page gives strap and lug widths only.
#   * `family` — a human's judgement, never a seeding run's.

series:
  id: bm-200
  name: BM-200
  line: vintage

models:
  - id: bm-200
    ref: BM-200
    source: { url: 'https://casiorestore.com/casio-bm-200-technical-data-model-information/', kind: community }
    display: digital
    module: '983'
    case: { material: 'Resin' }
    water_resistance_m: 100
    features: [stopwatch, multi-alarm, hourly-time-signal, led-light, altimeter, barometer, ascent-descent-speed, acrylic-crystal]
    # REFUSED, AND NOT FOR WANT OF A LICENCE. The page carries two photographs of
    # the watch, 800 × 500 each, and both are the article's own header graphics:
    # a cream field with "Casio BM-200 / Yellow button color version" set in large
    # type beside the watch. Downloaded and looked at before this line was
    # written. The dial in each prints CASIO BM-200, so they are excellent proof
    # of identity — and a picture with a website's headline baked into the frame
    # is not a catalogue photograph. Cropping does not rescue it: the watch
    # occupies roughly 290 px of the 800, under §10.3's 300 px floor.
    #
    # A THIRD CANDIDATE WAS SUPPLIED BY THE CLIENT 2026-09-08 and it is the best
    # picture of this watch anybody here has seen — 960 × 978, the watch filling
    # the frame on a stand, the dial printing CASIO BM-200 and WATER 100M RESIST
    # legibly enough to read the orange buttons this file's header describes.
    # Refused anyway, and not for the pixels. Its Zone.Identifier stream names
    # `scontent.fgyd21-1.fna.fbcdn.net/v/t39.30808-6/702858824_…` with
    # `ReferrerUrl=https://www.facebook.com/`: a collector's own photograph
    # posted to Facebook, so there is no author this catalogue can name, no
    # licence stated anywhere, and the URL itself carries an `oe=` expiry token
    # and will stop resolving — a credit a reviewer cannot open is decoration
    # (D41). It is also shot on a green cutting mat over a wooden floor, which is
    # a documentation photograph rather than a product shot. **The route that
    # would work is a permission**, not a better crop: whoever took it can grant
    # one, and then it is `own-work` or a named licence and it goes in.
    image: null
    discontinued: true
