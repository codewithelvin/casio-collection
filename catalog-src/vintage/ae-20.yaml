# Seeded 2026-09-05 from The Digital Watch Library, walking all 48
# pages of its Casio gallery and writing down every watch this catalogue did not
# already hold.
#
# DWL is the third roster. Neither of the two this project normally asks — the
# archive's index of casio.com product pages, and Casio's sitemap today — knows
# these references, which for a watch this old is the expected condition and not
# a finding: there was never a casio.com page to archive.
#
# Every field below is read off the one page named in `source`, BY DIV ID. The
# stripped value list ends `… [SS], 1976` and the tempting `[SS]` is the
# BRACELET, not the case; `case` comes from `#case1`. Where the two agree the
# error is invisible, which is why the rule is mechanical rather than a check.
#
# Deliberately absent (D27 — absent means nobody has found it):
#   * `display` and `movement`, which these pages do not state;
#   * a light feature, where the page shows an untyped light icon and the
#     vocabulary has five specific light values and no generic one;
#   * `water_resistance_m` where the page says NONE, which is a statement about
#     the watch and not a depth.
#
# `discontinued` is not written by hand — D59 measures it for the whole
# catalogue at once, against Casio's own sitemap.

series:
  id: ae-20
  name: AE-20
  line: vintage
  aka: ['TWIN GRAPH']

models:
  - id: ae-20w
    ref: AE-20W
    source: { url: 'http://www.digital-watch.com/DWL/1work/casio-ae-20w1', kind: community }
    year: 1989
    module: '588'
    case: { material: resin }
    water_resistance_m: 50
    features: [alarm, countdown-timer, dual-time, stopwatch]
    # Byte-for-byte `_large/1270.jpg` from the page in `source`, which is titled
    # AE-20W. The two variants have a page each and both pages show both
    # thumbnails, so the shared `_small` pair is variant navigation and not a
    # lead image — taking it by position would hand this one the -7's picture.
    # Looked at: a black TWIN-GRAPH, matching the series aka.
    image: ae-20w
    image_credit:
      author: 'The Digital Watch Library'
      licence: rights-reserved
      url: 'http://www.digital-watch.com/DWL/1work/casio-ae-20w1'
    discontinued: true
  - id: ae-20w-7
    ref: AE-20W-7
    source: { url: 'http://www.digital-watch.com/DWL/1work/casio-ae-20w2', kind: community }
    year: 1984
    module: '588'
    case: { material: resin }
    water_resistance_m: 50
    features: [alarm, countdown-timer, dual-time, stopwatch]
    # Byte-for-byte `_large/1614.jpg` from the page in `source`, titled AE-20W-7.
    # Looked at: the same TWIN-GRAPH in cream with blue pushers, which is the
    # colourway the -7 suffix names.
    image: ae-20w-7
    image_credit:
      author: 'The Digital Watch Library'
      licence: rights-reserved
      url: 'http://www.digital-watch.com/DWL/1work/casio-ae-20w2'
    discontinued: true
