# Seeded 2026-09-05 from The Digital Watch Library, walking all 48
# pages of its Casio gallery and writing down every watch this catalogue did not
# already hold.
#
# DWL is the third roster. Neither of the two this project normally asks — the
# archive's index of casio.com product pages, and Casio's sitemap today — knows
# these references, which for a watch this old is the expected condition and not
# a finding: there was never a casio.com page to archive.
#
# Every field below is read off the one page named in `source`, BY DIV ID. The
# stripped value list ends `… [SS], 1976` and the tempting `[SS]` is the
# BRACELET, not the case; `case` comes from `#case1`. Where the two agree the
# error is invisible, which is why the rule is mechanical rather than a check.
#
# Deliberately absent (D27 — absent means nobody has found it):
#   * `display` and `movement`, which these pages do not state;
#   * a light feature, where the page shows an untyped light icon and the
#     vocabulary has five specific light values and no generic one;
#   * `water_resistance_m` where the page says NONE, which is a statement about
#     the watch and not a depth.
#
# `discontinued` is not written by hand — D59 measures it for the whole
# catalogue at once, against Casio's own sitemap.

series:
  id: r-16
  name: R-16
  line: vintage

models:
  - id: r-16
    ref: R-16
    source: { url: 'http://www.digital-watch.com/DWL/1work/casio-casiotron-r-16', kind: community }
    year: 1976
    module: '16'
    case: { material: stainless steel }
    # image: null — SOMEBODY LOOKED, 2026-09-05. A 400x500 file carrying the
    # DIGITAL WATCH watermark reached this repo for this id, but **this page
    # names no large photograph at all** — only a strip of small thumbnails,
    # and those show other references. So there is nothing here to check it
    # against and nothing that ties the picture to this reference. Not a
    # missing photograph: an unprovable one (D29, D41).
    image: null
    discontinued: true
