# W-752 — seeded 2026-09-09 from javys.com, a Hong Kong Casio distributor,
# by direct request. Every field below is read off the one page named in
# `source`; `year` comes from the series page instead
# (`series.php?series_id=DA0006`, "Digital-Analog: SPORTY FASHION 10-Year
# Battery Life Series (2007-07)"), so it travels in `year_source` (D54).
#
# `image` is javys's only photograph, 163-164px wide — under the skill's
# usual 300px floor, published anyway per the client's 2026-09-09 instruction
# that any confirmed photograph beats none for a reference this hard to find.
#
# TWO FEATURES THE PAGE STATES AND NEITHER IS WRITTEN DOWN: "Pacemaker"
# (a beep to set exercise pace) and "Snooze Feature" are not in
# src/catalog/vocabulary.ts's FEATURES list, and guardrail 4 says a value not
# in the vocabulary is reported and asked about, never added as a side effect
# of seeding three models. "Spherical Glass" is a shape, not one of the
# tracked crystal materials (mineral/sapphire/acrylic), so it is left out for
# the same reason rather than guessed onto one of those three.
#
# Deliberately absent: `water_resistance_m` is written (10 BAR = 100m, the
# page states both); band material is never a tracked field on this project.

