# AN-8 — seeded 2026-08-25 from The Digital Watch Library.
#
# Two models, each read off its own page. They are two references and not two
# photographs of one: `casio-an8` says AN-8 and `casio-an-8g` says AN-8G, and
# the second page's own photograph shows a caseback stamped `104 | AN-8G
# STAINLESS STEEL BACK`, which is the reference and the module together on the
# metal. A community source, labelled as one — both predate casio.com and are
# in neither roster `survey.ts` reads.
#
# **`display` is deliberately absent on both, and that is a decision rather
# than an oversight.** DWL files them under "DigitalHands", whose gloss is "an
# analogue face represented by LCD segments" — but the photographs show what a
# reader would call an analogue dial, and only a faint segment arc suggests
# otherwise. `digital` and `analog` are both defensible readings of the same
# picture, which is exactly when D27 says the honest value is no value.
#
# DELIBERATELY NOT WRITTEN:
#   * `water_resistance_m` — AN-8's page says WATER RESIST and AN-8G's says
#     NONE. Neither is a depth.
#   * `family`, `discontinued` — a human's judgement, and a measurement (D59).

series:
  id: an-8
  name: AN-8
  line: vintage

models:
  - id: an-8
    # The `# ref-exception` that stood here until 2026-08-27 is gone because the
    # rule it named is gone: this entry's "rather than the rule widened for two
    # entries" was the right call at two, and at five one-digit references across
    # two lines `lines.yaml` corrected the bound to `[0-9]{1,5}` instead. AN-8 and
    # AN-8G now match the pattern outright. Nothing about the watches changed.
    ref: AN-8
    source: { url: 'http://www.digital-watch.com/DWL/1work/casio-an8', kind: community }
    year: 1980
    module: '104'
    case: { material: chrome plated base-metal }
    features: [alarm, countdown-timer]
    image: an-8
    image_credit:
      author: The Digital Watch Library
      licence: rights-reserved
      url: 'http://www.digital-watch.com/DWL/1work/casio-an8'
    discontinued: true
  - id: an-8g
    ref: AN-8G
    source: { url: 'http://www.digital-watch.com/DWL/1work/casio-an-8g', kind: community }
    year: 1980
    module: '104'
    case: { material: chrome plated base-metal }
    # No function icons on this page at all. That is the page saying nothing
    # about the functions, not the watch having none (D27).
    image: an-8g
    image_credit:
      # The lead photograph on this page is the caseback — proof of identity
      # and not a product shot — so the picture published is the second one it
      # names, `an811.jpg`, which is the watch face on.
      author: Casiophile
      licence: rights-reserved
      url: 'http://www.digital-watch.com/DWL/1work/casio-an-8g'
    discontinued: true
