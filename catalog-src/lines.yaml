# The eight watch lines of D15, and the three things the build needs to know
# about each one: how it is presented, what a reference code looks like in it,
# and which display groupings its series may belong to.
#
# ORDER IS EDITORIAL AND IS THE ORDER OF THIS LIST. There is no `order:` field,
# because a number beside a list is a second copy of the same fact and the two
# disagree the first time somebody moves a line without renumbering.
#
# `ref_pattern` is §10.2 check 3. There is no single Casio grammar — `F-91W-1`,
# `AE-1200WHD-1AV` and `EQB-1100D-1A` share no shape — so each line carries its
# own and refines it as the line is seeded. Every line starts from the same
# permissive pattern below, which is derived from references that actually exist
# across all eight lines rather than from a rule Casio publishes (they publish
# none). A reference the pattern does not match is a **warning, not a failure**:
# the exception is usually real, and a rule that blocks real data gets deleted.
# Silence it by writing `# ref-exception: <why>` on the model entry.
#
#   [A-Z]{1,5}     the prefix letters      GA, DW, GW, PRW, MRG, A, F
#   -?             the hyphen, if any      A158WA-1 has none
#   [A-Z]{0,2}     a letter before digits  GW-M5610U, OCW-S400
#   [0-9]{2,5}     the number              24, 158, 2100, 5610, 1200
#   [A-Z0-9]*      the variant block       E, WA, WHD, BB
#   (-[A-Z0-9]+)*  the suffixes            -1A1, -7B, -1AV
#
# `families` is D32's vocabulary — a display grouping above the series, chosen
# by a human, never appearing in a URL. It is deliberately almost empty: a
# family is a judgement about how a watch looks, and the honest time to make it
# is when the series are in front of you. The skill may propose one and reports
# the proposal; it never writes one here on its own (§10.6 guardrail 4a).

lines:
  - id: g-shock
    name: G-SHOCK
    slug: g-shock
    accent: '#F25C05'
    ref_pattern: '[A-Z]{1,5}-?[A-Z]{0,2}[0-9]{2,5}[A-Z0-9]*(?:-[A-Z0-9]{1,6})*'
    families:
      # D32's own example: DW-5600, GW-M5610 and GWX-5600 are three series and
      # one shape. "Square" is the word collectors use, and FR-2.1 makes search
      # match it, so typing `square` reaches all three reference prefixes.
      - id: square
        name: The square
      - id: octagonal
        name: Octagonal

  # D21 — "Casio Collection" is what Casio calls this line in Europe and also the
  # name of this site. Carrying both senses in the label is what keeps them apart
  # inside the product.
  - id: vintage
    name: Vintage / Casio Collection
    slug: vintage
    accent: '#B08D57'
    ref_pattern: '[A-Z]{1,5}-?[A-Z]{0,2}[0-9]{2,5}[A-Z0-9]*(?:-[A-Z0-9]{1,6})*'

