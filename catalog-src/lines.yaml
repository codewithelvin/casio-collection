# The watch lines of D15 — seven of them since D49 moved Databank into Vintage as
# a family — and the three things the build needs to know about each one: how it
# is presented, what a reference code looks like in it, and which display
# groupings its series may belong to.
#
# ORDER IS EDITORIAL AND IS THE ORDER OF THIS LIST. There is no `order:` field,
# because a number beside a list is a second copy of the same fact and the two
# disagree the first time somebody moves a line without renumbering.
#
# `ref_pattern` is §10.2 check 3. There is no single Casio grammar — `F-91W-1`,
# `AE-1200WHD-1AV` and `EQB-1100D-1A` share no shape — so each line carries its
# own and refines it as the line is seeded. Every line starts from the same
# permissive pattern below, which is derived from references that actually exist
# across every line rather than from a rule Casio publishes (they publish
# none). A reference the pattern does not match is a **warning, not a failure**:
# the exception is usually real, and a rule that blocks real data gets deleted.
# Silence it by writing `# ref-exception: <why>` on the model entry.
#
#   [A-Z]{1,5}     the prefix letters      GA, DW, GW, PRW, MRG, A, F
#   -?             the hyphen, if any      A158WA-1 has none
#   [A-Z]{0,2}     a letter before digits  GW-M5610U, OCW-S400
#   [0-9]{1,5}     the number              8, 24, 158, 2100, 5610
#   [A-Z0-9]*      the variant block       E, WA, WHD, BB
#   (-[A-Z0-9]+)*  the suffixes            -1A1, -7B, -1AV
#
# THE NUMBER WAS `{2,5}` UNTIL 2026-08-27 AND THAT BOUND WAS SIMPLY WRONG. This
# pattern claims to be derived from references that actually exist, and five that
# exist have one digit: AN-8 and AN-8G (1980), PRT-1GPJ (1999), WMP-1 and WQV-1
# (2000). Two earlier sessions met the warning and declined to widen — AN-8's
# entry said "rather than the rule widened for two entries", PRT-1GPJ's "for one
# entry" — and both were right at the count they had. At five across two lines
# the exception is the rule, so the bound is corrected and those
# `# ref-exception` comments are removed rather than left asserting a rule that
# no longer exists. Measured either side of the change: of 3,143 references
# exactly those five failed `{2,5}`, none fails `{1,5}`, and nothing else is
# newly admitted, so no typo is newly hidden.
#
# ONE MECHANICAL NOTE, kept here because it outlived the comments that carried
# it. `refExceptionsOf` reads `item.commentBefore`, and a comment above the
# FIRST item of a sequence is attached by the parser to the `models:` key
# instead — so a `# ref-exception` written one line too high is invisible to the
# check and to nothing else. Put it INSIDE the entry, under `- id:`.
#
# `families` is D32's vocabulary — a display grouping above the series, chosen
# by a human, never appearing in a URL. It is deliberately almost empty: a
# family is a judgement about how a watch looks, and the honest time to make it
# is when the series are in front of you. The skill may propose one and reports
# the proposal; it never writes one here on its own (§10.6 guardrail 4a).

lines:
  - id: g-shock
    name: G-SHOCK
    slug: g-shock
    accent: '#F25C05'
    ref_pattern: '[A-Z]{1,5}-?[A-Z]{0,2}[0-9]{1,5}[A-Z0-9]*(?:-[A-Z0-9]{1,6})*'
    families:
      # D32's own example: DW-5600, GW-M5610 and GWX-5600 are three series and
      # one shape. "Square" is the word collectors use, and FR-2.1 makes search
      # match it, so typing `square` reaches all three reference prefixes.
      - id: square
        name: The square
      - id: octagonal
        name: Octagonal

      # Casio's own sub-collections inside Master of G, and the two of them that
      # hold more than one catalogued series. Neither name is inferred from a
      # reference prefix: both are already in this repo as `aka` values read off
      # the module guides these series were seeded from — GG-1000 and GWG-1000
      # say Mudmaster, GWF-1000 and GWF-D1000 say Frogman — and Mudmaster is a
      # segment in Casio's own sitemap, `gshock/products/mudmaster/gg-b100/`, in
      # two locales.
      #
      # NOT `master-of-g`, which is the collection above these two and does have
      # a category page of its own (`us/watches/gshock/products/master-of-g/`).
      # **Nothing states which references are in it.** That page answers 403 to
      # anything that is not a person and the roster gives it no children, so a
      # `master-of-g` family would be a guess about five series where these two
      # are a reading of two. GPR-H1000 is the Rangeman and is the same story
      # one series smaller: real, named nowhere we can read, and alone.
      - id: frogman
        name: Frogman
      - id: mudmaster
        name: Mudmaster

  # "Casio Collection" is Casio's own name for this line in Europe; "Vintage" is
  # what it is called elsewhere and what collectors say. Both are in the label
  # because a reader arrives with one word or the other.
  #
  # Until D39 this was also the name of the site, which is what D21 accepted as a
  # permanent search collision and what the rename removed. The label is unchanged
  # — it was always about Casio's naming and never about ours.
  - id: vintage
    name: Vintage / Casio Collection
    slug: vintage
    accent: '#B08D57'
    ref_pattern: '[A-Z]{1,5}-?[A-Z]{0,2}[0-9]{1,5}[A-Z0-9]*(?:-[A-Z0-9]{1,6})*'
    families:
      # D49 — Databank was one of D15's eight lines and is now a family here,
      # because Casio files it here. There is no `databank` segment anywhere in
      # casio.com's sitemap: DB-, DBC- and the calculator shapes are all inside
      # the general `casio` roster, which is the same roster Vintage comes from.
      # A line whose roster does not exist can never be seeded, and a permanent
      # empty card on the front door is worse than an honest grouping one level
      # down.
      #
      # Nothing is tagged into it yet. `abx-20` is the only Databank-shaped
      # series seeded, and a family of one does not render as a heading (D32,
      # check 4) — it would only add a warning. It gets tagged when a second one
      # arrives, along with that one.
      - id: databank
        name: Databank

      # Casio's own sub-collection inside its Standard range, and the only
      # family in this file whose membership comes from the **live roster**
      # rather than from a page: nine `casio/standard/vintage/<series>` paths
      # name a series this catalogue holds — a130, a158, a159, a168, abl-100,
      # aq-230, ca-500, la670, la680. The German roster files five of the same
      # nine under `casio/vintage/brand/`, which is the same claim in the other
      # locale and nothing new.
      #
      # "Casio Vintage" and not plain "Vintage", though Casio's path says the
      # shorter word. This line is already called Vintage / Casio Collection,
      # and a family repeating that label would imply the F- and W-series
      # digitals beside it are somehow not vintage — which is false, and they
      # are the oldest watches in the catalogue.
      - id: casio-vintage
        name: Casio Vintage

      # Read off the pages themselves rather than inferred from anything: all
      # twelve WVA-M630 pages and all four LCW-M100 ones link to
      # `watches/casio/waveceptor/`, which is also a segment in Casio's sitemap
      # (us and de). `productSeries` says `Solar combination` on all twenty and
      # is **not** the collection name — the link is the evidence and that field
      # is a hint, which is the finding both files were committed with.
      #
      # LCW-M100 is a LINEAGE as well, named six times on each of its pages. A
      # series carries exactly one family, so the family is the name the two
      # series share and the other stays in `aka`, where both already are.
      - id: wave-ceptor
        name: Wave Ceptor

      # One collection under two of Casio's own names. The SGW-100 pages print
      # SPORTS GEAR above the reference and carry `productSeries: "SPORTS
      # GEAR"`; the SDB-100 pages carry the same field and link to
      # `/jp/watches/casio/phys/`. Both names are in the label because neither
      # roster has a segment for either — PHYS is Japanese-market branding, and
      # the sitemap this project reads is us, intl and de — so a reader arrives
      # with one word or the other and finds nothing under the one we dropped.
      #
      # HDD-600 is deliberately **not** in it. It was a candidate when this
      # collection was resolved and its own page settled it against:
      # `productSeries: "Digital"`, where these two say SPORTS GEAR.
      - id: sports-gear
        name: Sports Gear / PHYS

  - id: edifice
    name: Edifice
    slug: edifice
    accent: '#1F4E79'
    ref_pattern: '[A-Z]{1,5}-?[A-Z]{0,2}[0-9]{1,5}[A-Z0-9]*(?:-[A-Z0-9]{1,6})*'

  - id: pro-trek
    name: Pro Trek
    slug: pro-trek
    accent: '#2E7D32'
    ref_pattern: '[A-Z]{1,5}-?[A-Z]{0,2}[0-9]{1,5}[A-Z0-9]*(?:-[A-Z0-9]{1,6})*'

  - id: baby-g
    name: Baby-G
    slug: baby-g
    accent: '#E5559E'
    ref_pattern: '[A-Z]{1,5}-?[A-Z]{0,2}[0-9]{1,5}[A-Z0-9]*(?:-[A-Z0-9]{1,6})*'

  - id: sheen
    name: Sheen
    slug: sheen
    accent: '#8E7CC3'
    ref_pattern: '[A-Z]{1,5}-?[A-Z]{0,2}[0-9]{1,5}[A-Z0-9]*(?:-[A-Z0-9]{1,6})*'

  - id: oceanus
    name: Oceanus
