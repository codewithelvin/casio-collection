# D62 — the editions: named limited and collaboration releases, and the second
# grouping over this catalogue.
#
# ORDER IS EDITORIAL AND IS THE ORDER OF THIS LIST, exactly as in lines.yaml and
# for the same reason: a number beside a list is a second copy of the same fact,
# and the two disagree the first time somebody moves an entry without
# renumbering. Casio's own collaborations first, in the order Casio published
# them; the ones read off a shop or an enthusiast page after.
#
# AN EDITION IS NOT A SERIES AND IS NOT SHAPED LIKE ONE. A series is the
# reference prefix (D32) — mechanical, one per model, never crossing a line. An
# edition crosses everything: PAC-MAN is four references in four different
# series, and nothing in `A168WEPC-7A` says so. `A168WECK-7A` is a Café Kitsuné
# collaboration and `A168WECM-5` is a rose-gold colourway; they differ by one
# letter, and no pattern can tell them apart. So every membership here is read
# off a page, one reference at a time.
#
# EVERY EDITION CARRIES A SOURCE, WHICH IS WHAT SEPARATES IT FROM A FAMILY. A
# family (D32) is a judgement about how a watch looks and needs no citation. An
# edition says two companies made something together, which is a claim about the
# world — so §10.6's rule applies to it as it applies to a model: a page states
# it, or it is not written down.
#
# THE SOURCE IS THE PAGE THAT NAMES THE REFERENCES, WHERE ONE EXISTS. Casio
# publishes a landing page per vintage collaboration and each one lists its own
# lineup, so that single page establishes both that the edition exists and which
# references are in it. Where it does not — the two G-SHOCK anime collaborations
# and the three environmental ones below — the source is the listing that names
# one reference, and it is marked `retailer` so the reader is told what kind of
# page it was (FR-3.2a).
#
# AN EDITION IS A NAMED RELEASE. IT IS NOT ONLY A COLLABORATION. It is also a
# dedication, an anniversary, a seasonal collection, a themed run — anything
# Casio gave a name to and released under it. This file used to reason as though
# the two words were interchangeable, and that was wrong twice over: it is not
# what D62 says (README: "a named limited **or** collaboration release"), and it
# was actively keeping real editions out. Five entries below have no `partner` at
# all, and they belong here exactly as much as PAC-MAN does.
#
# THE LINE THAT IS ACTUALLY DRAWN is between a named *release* and a named
# *colourway*. Both have names; only one is an edition. The page itself is what
# settles it, as ever — WatchOutz calls "Breezy Color" (DW-5600SN-1) and
# "Geometric Design" (DW-6900DS-1) part of the standard lineup, in those words,
# so neither is written here however much the name sounds like one. If a page
# later calls either a special edition, that page is the reason to add it.
#
# WHAT IS DELIBERATELY NOT HERE:
#   * `kind`. Not for the reason this file used to give — "every edition below is
#     a collaboration" stopped being true on 2026-08-28 — but for a better one:
#     the taxonomy would be OURS. Casio does not publish a consistent word for
#     the difference between a dedication, an anniversary, a seasonal selection
#     and a themed colour run, so a `kind` field would be this catalogue
#     inventing a classification and then asserting it, which is the one thing
#     D62 says it does not get to do. `partner` still draws the only distinction
#     a page actually states: somebody else was involved, or nobody was.
#   * A year on all but PAC-MAN. Casio's collaboration pages date the *brands* —
#     UNO's cards are from 1979, Café Kitsuné opened in 2013 — and carry a
#     copyright footer, and neither is a release date. D25 is that the catalogue
#     reports what a page says and nothing adjacent to it. The PAC-MAN page
#     states its own year in a sentence, so that one is written.

editions:
  # Casio's own vintage collaborations. Each `source` is Casio's landing page for
  # that collaboration, read through the archive because casio.com answers 403
  # or times out to anything that is not a person (D52).
  - id: pac-man
    name: PAC-MAN Collaboration
    partner: Bandai Namco Entertainment Inc.
    # The page says it in a sentence rather than in a footer: "Presenting a
    # lineup of special collaboration watches celebrating 50 years of Casio
    # watches and the 45th anniversary of PAC-MAN in 2025."
    year: 2025
    aka: [Pac-Man, PACMAN]
    source:
      {
        url: 'https://web.archive.org/web/20250119024502id_/https://www.casio.com/intl/watches/casio/standard/vintage/pac-man_collaboration/',
        kind: official,
      }

  - id: uno
    name: UNO Collaboration
    partner: Mattel
    aka: [UNO]
    source:
      {
        url: 'https://web.archive.org/web/20250405031922id_/https://www.casio.com/ca-en/watches/casio/vintage/a168weuc/',
        kind: official,
      }

  # The accented name is why `aka` exists on this schema at all. Search keeps
  # only ASCII letters and digits, so "Café Kitsuné" indexes as `cafkitsun` and
  # the word a keyboard actually produces would match nothing.
  - id: cafe-kitsune
    name: Café Kitsuné Collaboration
    partner: Café Kitsuné
    aka: [Cafe Kitsune, Kitsune, Maison Kitsune]
    source:
      {
        url: 'https://web.archive.org/web/20231013152706id_/https://www.casio.com/us/watches/casio/classic/a168weck/',
        kind: official,
      }

  - id: stranger-things
    name: Stranger Things Collaboration
    partner: Netflix
    aka: [Stranger Things]
    source:
      {
        url: 'https://web.archive.org/web/20230528075635id_/https://www.casio.com/intl/watches/casio/standard/vintage/strangerthings/',
        kind: official,
      }

  - id: apc
    name: A.P.C. Collaboration
    partner: A.P.C.
    # "APC" without the stops is what a search field receives; the name itself
    # normalises to `apc` too, and the alias is here for the reader who types the
    # brand as it is written on the page.
    aka: [APC, A.P.C.]
    source:
      {
        url: 'https://web.archive.org/web/20250411001346id_/https://www.casio.com/europe/watches/casio/vintage/brand/apc_collaboration/',
        kind: official,
      }

  # The G-SHOCK collaborations. This used to read "which have no Casio landing
  # page in the archive", and that was true of the two below and is not true of
  # the line — Coca-Cola's page was found on 2026-08-25 by asking the CDX index
  # for a PATH fragment rather than for `product.<REF>`, which is the only query
  # `survey.ts --deep` makes. A landing page is invisible to a reference search.
  # Worth repeating for the next G-SHOCK collaboration somebody looks for.
  - id: coca-cola
    # As the page titles itself. Casio's own words, not "Casio × Coca-Cola".
    name: Coca-Cola Collaboration Model
    # The page names the collaborator in its own title and nowhere names the
    # legal entity, so this is "Coca-Cola" and not "The Coca-Cola Company" —
    # the same reading as Dragon Ball Z below, where the partner is the magazine
    # the page names rather than the licensors printed beside it.
    partner: Coca-Cola
    aka: [Coke, CocaCola]
    # NO `year`. The page's only date is the footer, "2024 CASIO AMERICA, INC.",
    # which is a copyright line and not a release date — the rule this file
    # already states at the top. The `23` inside DW-5600CC23-4 is not a source
    # either; inferring a year from a reference code is exactly what D25 forbids.
    source:
      {
        url: 'https://web.archive.org/web/20241217114649id_/https://gshock.casio.com/us/products/collection/limited/coca-cola/',
        kind: official,
      }

  # The two below have no Casio landing page. Each source is the stockist listing
  # that names the collaboration and the reference in the same sentence — the
  # same page the entry's photograph is already credited to (D53), and marked
  # `retailer` so the watch page says so.
  # Both listings are titled "Casio G-Shock X Shounen Jump '<title>' Limited
  # Edition", so the partner is the magazine as the page names it — Shueisha,
  # Toei Animation and Bird Studio appear on the Dragon Ball page as licensors
  # rather than as the party Casio worked with, and the difference is exactly
  # the sort of thing this catalogue does not get to decide on its own.
  - id: dragon-ball-z
    name: Dragon Ball Z
    partner: Shounen Jump
    # "DBZ" is not a substring of "dragonballz", so the alias is the only way a
    # reader who types the initials reaches the watch.
    aka: [DBZ, Shonen Jump]
    source:
      {
        url: 'https://watchoutz.com/products/casio-g-shock-dragon-ball-z-limited-edition-ga-110jdb-1a4',
        kind: retailer,
      }

  - id: one-piece
    name: One Piece
    partner: Shounen Jump
    aka: [Shonen Jump]
    source:
      {
        url: 'https://watchoutz.com/products/casio-g-shock-x-shounen-jump-one-piece-limited-edition-ga-110jop-1a4',
        kind: retailer,
      }

  # The environmental collaborations, found 2026-08-28 by asking a different
  # question: not "which references are in a declared edition" but "which
  # catalogued models cite a page that names an edition". Three did, and none of
  # them was declared here — which is the gap a reader reported after noticing a
  # special-edition watch that appeared in no listing.
  #
  # WHY THEY WERE INVISIBLE. Every earlier edition was found from its landing
  # page downwards: read the page, take the lineup, write the references. These
  # were already in the catalogue with the naming page already cited — as the
  # `image_credit` on the entry, not as anything the edition vocabulary could
  # see. Nothing was missing from the entries; what was missing was the question.
  # The audit that asks it is worth keeping.
  #
  # LOVE THE SEA AND THE EARTH IS A CAMPAIGN, NOT AN EDITION, AND THAT IS WHY
  # THERE ARE TWO OF THEM BELOW. G-SHOCK has run it since 1994 with a different
  # environmental organisation each time, so the two references this catalogue
  # holds are two different collaborations that share a slogan — different
  # partner, different year, six years apart. Collapsing them into one edition
  # would assert that ICERC and WILDLIFE PROMISING are the same body. The year is
  # in each `name` because it is the only thing that tells the two cards apart at
  # a glance, and both pages state their own year in their own title.
  - id: love-the-sea-2014
    name: Love The Sea And The Earth 2014
    # As the page writes it. The stops are dropped here and kept in `aka`,
    # because the page's own title uses both forms in one sentence.
    partner: ICERC Japan
    year: 2014
    aka: [ICERC, I.C.E.R.C., Love The Sea And The Earth, Love the Sea]
    source:
      {
        url: 'https://watchoutz.com/products/casio-g-shock-frogman-x-i-c-e-r-c-love-the-sea-and-the-earth-2014-special-edition-pink-gf-8250k-4',
        kind: retailer,
      }

  - id: love-the-sea-2019
    name: Love The Sea And The Earth 2019
    # "an Authorized Nonprofit Corporation (NPO) that works towards coexistence
    # between wildlife and humans in Africa", as the page introduces it. The
    # partner is the name, not the description.
    partner: WILDLIFE PROMISING
    year: 2019
    aka: [Wildlife Promising, WLP, Love The Sea And The Earth, Love the Sea]
    source:
      {
        url: 'https://watchoutz.com/products/casio-g-shock-mudmaster-triple-sensor-love-the-sea-and-the-earth-gwg-1000wlp-1a',
        kind: retailer,
      }

  # The Coca-Cola reading a third time: the partner is what the page's own title
  # names as the other party — "Casio G-Shock X Antarctic Research Rov" — and not
  # the institution named further down the page as having developed the vehicle.
  # The difference is exactly the sort of thing this catalogue does not get to
  # decide on its own.
  #
  # NOTE THE URL. Its slug says `gwf-1000-1jf` and the page it serves is titled
  # for GWF-D1000ARR-1, which is the reference this catalogue holds. The slug is
  # the shop's, and it is wrong; the title is the page's, and it is right. Worth
  # writing down, because the mismatch reads as a miscredited photograph until
  # somebody opens it.
  - id: antarctic-research-rov
    name: Antarctic Research ROV Special Edition
    partner: Antarctic Research ROV
    aka: [Antarctic, ARR, ROV]
    source:
      {
        url: 'https://watchoutz.com/products/casio-g-shock-frogman-x-antarctic-research-rov-gwf-1000-1jf',
        kind: retailer,
      }

  # THE EDITIONS WITH NO PARTNER. Casio named each of these and released it under
  # the name; nobody outside Casio was involved. They were held back on
  # 2026-08-28 on the reading that an edition meant a collaboration, and added
  # the same day when that reading was corrected — the note at the top of this
  # file is the argument, and these five entries are what it was keeping out.
  #
  # "MEN IN ..." AND "MASTER IN ..." ARE CAMPAIGNS, SO EACH RELEASE IS ITS OWN
  # ENTRY — the same shape as Love The Sea And The Earth above, and for the same
  # reason. G-SHOCK has run "Men In" repeatedly with a different colourway and a
  # different year each time; the name of the thing is "Men In Burning Red", not
  # "Men In". Collapsing them would assert they were one release.
  - id: men-in-navy-blue
    # "Men In Navy Blue", as the page quotes it — NOT "Men in Navy", which is
    # what the shop's own URL slug says. The slug drops a word. Where the two
    # disagree the title wins, which is the third time that has come up here.
    name: Men In Navy Blue
    aka: [Men In Navy, Men In]
    source:
      {
        url: 'https://watchoutz.com/products/casio-g-shock-frogman-men-in-navy-gwf-1000nv-2jf',
        kind: retailer,
      }

  - id: men-in-burning-red
    name: Men In Burning Red
    # The one in this group the page calls a special edition in as many words.
    aka: [Men In Red, Burning Red, Men In]
    source:
      {
        url: 'https://watchoutz.com/products/casio-g-shock-frogman-men-in-burning-red-gwf-1000rd-4jf',
        kind: retailer,
      }

  - id: master-in-marine-blue
    name: Master In Marine Blue
    aka: [Marine Blue, Master In]
    source:
      {
        url: 'https://watchoutz.com/products/casio-g-shock-frogman-multi-band-6-solar-master-in-marine-blue-gwf-d1000mb-3',
        kind: retailer,
      }

  # The seasonal one, and the only edition in this file holding two references
  # that were read off two different pages — one per watch, each naming the
  # collection and its own reference. Neither page names the other's watch, which
  # is what `edition_source` exists for and why both entries carry one.
  - id: precious-heart-selection-2025
    name: Precious Heart Selection 2025
    # A release DATE, not a copyright footer: "2025.11.8 release", stated on both
    # pages. That clears the bar this file sets at the top for writing a year.
    year: 2025
    aka: [Precious Heart, Heart Selection]
    source:
      {
        url: 'https://ippojapanwatch.com/products/casio-g-shock-gm-2110sh-2ajf-precious-heart-selection-2025-analog-digital-watch-2025-11-8-release',
        kind: retailer,
      }

  # Baby-G, and the one edition here read off an enthusiast report rather than
  # Casio or a shop. The page names the reference in its own caption — "Casio
  # Baby-G x Madhappy BG169MH-7 watch" — which is what the entry's photograph is
  # already credited to.
  - id: madhappy
    name: Madhappy
    partner: Madhappy
    aka: [Madhappy]
    source:
      {
        url: 'https://gagadget.com/en/689708-casio-released-a-limited-series-baby-g-in-collaboration-with-madhappy/',
        kind: community,
      }
