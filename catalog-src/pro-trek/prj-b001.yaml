  # THE TWO ENTRIES BELOW ARE NOT OFF A CASIO PAGE, because the archive has none
  # for either: one domain-wide CDX query over casio.com filtered to
  # `product.PRJ-B001*` on 2026-09-05 returned 97 rows across the SEVEN other
  # references and zero of any status for these two. Casio's own sitemap lists
  # both, and casio.com answers 403 to everything that is not a person, so the
  # shop that stocks them is the best page that exists. Same rule as everywhere
  # else: one page per model, and every field below is on it.
  - id: prj-b001ex-1
    ref: PRJ-B001EX-1
    source:
      {
        url: 'https://ippojapanwatch.com/products/casio-prj-b001ex-1jr-protrek-hiker-line-gps-navigation-altimeter-barometer-thermometer',
        kind: retailer,
      }
    movement: solar
    water_resistance_m: 100
    features: [bluetooth, tough-solar, stopwatch, countdown-timer, alarm, led-light]
    # `image: null` IS A REFUSAL SOMEBODY MADE, not a gap (D29). Both photographs
    # this page carries show the watch fastened inside its own coin-case band
    # with the coins visible — a feature demonstration rather than a product
    # shot. The watch is perhaps a fifth of the frame, black on black, at 600 px.
    # The typographic tile is the better picture of this watch until a real one
    # exists, which is the whole reason the tile is a primary state.
    image: null
    discontinued: false
  # PRJ-B001NJ-3 IS A COLLABORATION and this entry does not say so, deliberately.
  # The shop titles it "Japan Nature Conservation Society x Pickles the Frog",
  # which is D62's territory — and D62 makes declaring an edition its own
  # confirmed step and its own commit, never a side effect of a seeding run. So
  # the watch is catalogued and the edition is proposed in the report.
  #
  # It has an archived capture, and that capture is why it is here rather than
  # seeded: 2 596 bytes of consent shell that states nothing about any watch.
  # `seed-into.ts` reported it as "0 rows" and refused it under D50, which was
  # right — but "the only capture is an empty JS shell" and "this reference has
  # no page" are different facts and only the first one is true.
  - id: prj-b001nj-3
    ref: PRJ-B001NJ-3
    source:
      {
        url: 'https://ippojapanwatch.com/products/casio-prj-b001nj-3jr-quartz-x-japan-nature-conservation-society-x-pickles-the-frog-2026-2-release',
        kind: retailer,
      }
    year: 2026
    case: { weight_g: 44 }
    water_resistance_m: 100
    features: [bluetooth, world-time, led-light, mineral-glass]
    # 2000 px, plain white ground, and the filename is `PRJ-B001NJ-3JR1.jpg` —
    # the reference with a boundary after it, which is the test that works. The
    # dial prints PRO TREK and CASIO, and the olive case matches what the page
    # describes. Credited to the shop under D11: it is Casio's photograph, but
    # Casio granted nothing and the shop is where it was taken from (D41).
    image: prj-b001nj-3
