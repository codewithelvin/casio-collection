        url: 'https://www.g-central.com/pro-trek-prw-35ld-5-and-prw-35tld-7-are-the-first-casio-watches-with-a-phosphorescent-digital-lcd-display-for-light-free-viewing-in-the-dark/',
        kind: community,
      }
    year: 2025
    display: digital
    movement: solar-radio
    case: { width_mm: 44.6, height_mm: 51.2, depth_mm: 13, weight_g: 81 }
    water_resistance_m: 100
    features: [compass, barometer, thermometer, altimeter, sunrise-sunset, radio-controlled, tough-solar, sapphire-crystal]
    image: prw-35tld-7
    image_credit:
      author: G-Central
