# PRW-35 — seeded 2026-08-17 (M9).
#
# THE ROSTER IS CASIO'S OWN SITEMAP, which is what closed O11. casio.com's
# product pages answer 403 and its AEM paths return the location picker, but
# `casio.com/<locale>/sitemap.xml` answers 200 and lists every product URL with
# the reference in the path:
#   https://www.casio.com/us/watches/edifice/product.EFR-527D-1AV/
# So "which references exist" is Casio saying so, where G-SHOCK's roster is a
# community index saying the same thing. It is still provenance for a model's
# IDENTITY only — the sitemap states no specifications.
#
# THE FIELDS ARE THE MODULE GUIDE (D44), named in `source`, read off its
# Specifications table. WHICH MODULE a series runs is the one link neither source
# provides: that comes from casiofanmag's per-line table, a community source that
# says of itself that it cannot guarantee accuracy. It is used exactly as
# ShockBase is — identity, never fields.
#
# So three sources, and the split is deliberate: Casio for what exists, a
# community table for which guide to open, and Casio's guide for every value
# written. A reader clicking `source` lands on the page every field came from,
# which is what §10.6's one-page rule is for.
#
# THE PHOTOGRAPHS COME FROM A DIFFERENT PAGE, and each one says so (D53).
# For the six manual-sourced entries that is Casio's own archived product page
# for that exact reference (D52), which is what `image_credit.url` points at,
# and the file is served live by casio.com from the `/content/dam/` path that
# page names — never a path derived from the reference, which is the whole of
# D41. For the two 2025 references it is G-Central, because the archive has
# never captured either of them and there is no Casio page to take one off.
#
# EVERY ENTRY HERE NOW HAS ONE, as of 2026-09-05. That was not true before:
# PRW-35LD-5 had gone unphotographed since M9 because the archive holds no
# capture of it, which reads like an entry nobody got to rather than one whose
# page does not exist. The typographic card is a primary state and not a
# fallback (D29) — it is just not the right state for a watch a shop is
# photographing today.
#
# TWO ENTRIES ARE NOT SOURCED FROM A GUIDE AT ALL and say why on themselves:
# PRW-35LD-5, re-sourced because the guide it cited was the wrong guide, and
# PRW-35TLD-7, a Japan-only reference no manual route reaches. Both carry
# `year`, `case` and `water_resistance_m`, which the six below cannot:
#
# DELIBERATELY NOT WRITTEN, ON THE SIX MANUAL-SOURCED ENTRIES:
#   * `year` — the guide dates the module, never the reference (D25).
#   * `case`, `water_resistance_m`, `colorway` — the guide is about the module.

series:
  id: prw-35
  name: PRW-35
  line: pro-trek
  aka: [PRW35]

models:
  - id: prw-35-1a
    ref: PRW-35-1A
    source:
      {
        url: 'https://www.casio.com/content/dam/casio/global/support/manuals/watches/pdf/34/3490/qw3490_EN.pdf',
        kind: official,
      }
    display: digital
    movement: solar-radio
    module: '3490'
    features: [world-time, stopwatch, countdown-timer, multi-alarm, hourly-time-signal, compass, barometer, thermometer, altimeter, sunrise-sunset]
    image: prw-35-1a
    image_credit:
      author: Casio Computer Co., Ltd.
      licence: rights-reserved
      url: 'https://web.archive.org/web/20240714221416id_/https://www.casio.com/europe/watches/protrek/product.PRW-35-1A/'
    discontinued: false
  - id: prw-35-7
    ref: PRW-35-7
    source:
      {
        url: 'https://www.casio.com/content/dam/casio/global/support/manuals/watches/pdf/34/3490/qw3490_EN.pdf',
        kind: official,
      }
    display: digital
    movement: solar-radio
    module: '3490'
    features: [world-time, stopwatch, countdown-timer, multi-alarm, hourly-time-signal, compass, barometer, thermometer, altimeter, sunrise-sunset]
    image: prw-35-7
    image_credit:
      author: Casio Computer Co., Ltd.
      licence: rights-reserved
      url: 'https://web.archive.org/web/20250121085154id_/https://www.casio.com/in/watches/protrek/product.PRW-35-7/'
    discontinued: false
  # PRW-35LD-5 WAS RE-SOURCED ON 2026-09-05, off the module guide and onto the
  # page that describes this watch. It is the only entry here not read from a
  # Casio manual, and the reason is that the manual was the wrong manual.
  #
  # It cited module 3490's guide, and **that guide contains the string "luminous"
  # zero times** while module 3582's describes a display that "can be read in the
  # dark for approximately one hour". This watch is sold for that display. Three
  # things point the same way: 3582 was published 4/2025, one month before the
  # two luminous references shipped; 3490's guide is the 2023 PRW-35's; and
  # casiofanmag's PRW-35 page — the series→module table this file's header says
  # supplied the link — does not list PRW-35LD at all. A series table cannot
  # answer for a reference it has never heard of.
  #
  # SO `module` IS GONE RATHER THAN CHANGED TO 3582. Nothing states that this
  # reference runs 3582 either; the evidence is three facts converging, which is
  # a good lead and not a reading. An absent field is a question the next person
  # can answer — a plausible one is a lie the site repeats for years.
  #
  # The five timekeeping features went with it for the same reason: `world-time`,
  # `stopwatch`, `countdown-timer`, `multi-alarm` and `hourly-time-signal` were
  # read off 3490's specification table, which is not this watch's. The source
  # below states the rest, and `case` and `water_resistance_m` are new — the
  # guide never had them, because a guide is about a module and not a watch.
  - id: prw-35ld-5
    ref: PRW-35LD-5
    source:
      {
        url: 'https://www.g-central.com/pro-trek-prw-35ld-5-and-prw-35tld-7-are-the-first-casio-watches-with-a-phosphorescent-digital-lcd-display-for-light-free-viewing-in-the-dark/',
        kind: community,
      }
    year: 2025
    display: digital
    movement: solar-radio
    case: { width_mm: 44.6, height_mm: 51.2, depth_mm: 13, weight_g: 45 }
    water_resistance_m: 100
    features: [compass, barometer, thermometer, altimeter, sunrise-sunset, radio-controlled, tough-solar, luminous-lcd]
    # THE PHOTOGRAPH IS OFF THE SAME PAGE, which it was before the entry was:
    # there is no Casio page to take one off. PRW-35LD-5 is a May 2025 release
    # and the archive holds no capture of it under any host, path or locale (one
    # domain-wide CDX query, 2026-09-05; PRW-35-1A and PRW-35Y-1B answered 26
    # captures each in the same query, so the query was asked). The file is
    # Casio's own press shot as G-Central republishes it, named for the
    # reference with a boundary after it, and credited to the site it was taken
    # from under D11 — never to Casio, who granted nothing.
    image: prw-35ld-5
    image_credit:
      author: G-Central
      licence: rights-reserved
      url: 'https://www.g-central.com/pro-trek-prw-35ld-5-and-prw-35tld-7-are-the-first-casio-watches-with-a-phosphorescent-digital-lcd-display-for-light-free-viewing-in-the-dark/'
    discontinued: false
  # PRW-35TLD-7 IS THE ONE ENTRY IN THIS FILE WITH NO CASIO SOURCE AT ALL, and
  # both rosters are the reason rather than an excuse.
  #
  # Casio lists it — `casio.com/jp/sitemap/watches.xml` carries
  # `.../protrek/product.PRW-35TLD-7/` — and until 2026-09-05 `sitemap.ts` read
  # three locales of twenty-nine, none of them Japan, so the roster this project
  # asks had never seen this reference. **`jp` is in `LOCALES` now**, which is
  # why `discontinued` below is measured rather than absent; finding this watch
  # is what found the other 1 337 the same blind spot was hiding.
  #
  # The archive has still never captured it: zero rows of any status in a
  # domain-wide CDX query over casio.com filtered to `product.PRW-35*`, taken
  # 2026-09-05, in which PRW-35-1A and PRW-35Y-1B each returned 26. It passes
  # `CANONICAL_REF`, so this was never a D47 refusal.
  #
  # THE FIELDS ARE THEREFORE READ OFF G-CENTRAL, an enthusiast site, which is
  # the page that states the most about this reference of any this project can
  # reach. Casio's own page answers 403 to everything that is not a person, and
  # `casio.com/intl/news/` names no Pro Trek release in 2024-2026.
  #
  # `module` IS ABSENT AND THE CHASE IS WRITTEN DOWN, so nobody walks it twice.
  # Asked on 2026-09-05 and none of these states a module for this reference:
  # Casio's support redirector (`support.casio.com/global/en/wat/manual/`, whose
  # getURL() reads `modelname` and then ignores it — it resolves module→manual
  # only), casiofanmag's PRW-35 page (names PRW-35-1A, -7, Y-1B and Y-3 and no
  # TLD), everywatch ("Movement : Solar", no calibre), kakaku, IPPO JAPAN WATCH
  # and three Japanese shops. casio.com's own page answers 403.
  #
  # **Module 3582 is the strong lead and is deliberately not written.** Its
  # official guide is published 4/2025, one month before this watch shipped, and
  # its function list is this watch's exactly — Luminous LCD, World Time, Alarm,
  # Digital Compass, Altitude, Barometric Pressure and Temperature, Sunrise and
  # Sunset Times, Stopwatch, Timer. That is three facts converging, which is a
  # good lead and not a reading, and D44 wants the module read off a page that
  # states it. Somebody with a browser can settle it in one request.
  #
  # `year` is written because the source states it in a sentence — "will be
  # released in May 2025", on a page dated 2025-05-01 — which is the same route
  # the Vintage entries are dated by (D25, D54).
  #
  # STATED AND STILL NOT WRITABLE: low-temperature resistance. The vocabulary has
  # no value for it and adding one is its own confirmed step (rule 4).
  - id: prw-35tld-7
    ref: PRW-35TLD-7
    source:
      {
        url: 'https://www.g-central.com/pro-trek-prw-35ld-5-and-prw-35tld-7-are-the-first-casio-watches-with-a-phosphorescent-digital-lcd-display-for-light-free-viewing-in-the-dark/',
        kind: community,
      }
    year: 2025
    display: digital
    movement: solar-radio
    case: { width_mm: 44.6, height_mm: 51.2, depth_mm: 13, weight_g: 81 }
    water_resistance_m: 100
    features: [compass, barometer, thermometer, altimeter, sunrise-sunset, radio-controlled, tough-solar, sapphire-crystal, luminous-lcd]
    image: prw-35tld-7
    image_credit:
      author: G-Central
      licence: rights-reserved
      url: 'https://www.g-central.com/pro-trek-prw-35ld-5-and-prw-35tld-7-are-the-first-casio-watches-with-a-phosphorescent-digital-lcd-display-for-light-free-viewing-in-the-dark/'
    discontinued: false
