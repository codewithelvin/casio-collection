# PRT-40 -- the reference came from Casiold (casiold.com); every
# SPECIFICATION below was read from the Digital Watch Library on 2026-08-31,
# which is where this entry points.
#
# THE DEALER'S PHOTOGRAPH WAS OF A DIFFERENT WATCH, and it was published here
# for six days. A reader reported it on 2026-09-05: casiold.com/products/
# casio-prt-40 is titled "Casio PRT-40" and every one of its fourteen photos
# shows an ana-digi Pro Trek with hands over the LCD, a rotating compass bezel
# and an orange LIGHT button at 6 -- the PRG-40 shape. The PRT-40 is module
# 1470 and has no hands at all, which this entry said in the line above the
# image it contradicted. The photograph is now the DWL page's own, so the
# picture and every field come from one page and the entry cites one source.
#
# THE LESSON IS ABOUT THE TEST, NOT THE DEALER. A listing title is not proof
# of what is in the photograph, and 138 entries here took a Casiold picture on
# that basis. This one was caught by a human who knew the watch.
#
# NO YEAR. The page's RELEASED row says '>1995', which is the
# page hedging rather than stating, so nothing is written (D25).
#
# Read BY DIV ID, never by position. Stripping this page's tags and taking
# the values in order puts the BRACELET row last before the year, and it
# looks exactly like a casing material -- the casing above came from
# #case1 and nothing here was read off the end of a list.
#
# DELIBERATELY ABSENT: `display` -- no row states it, and reading it off the
# photograph is what D27 forbids.
# `movement` -- no row and no icon states how it is driven.
# `water_resistance_m` -- the row says 'WATER RESISTANT', which is a statement
#   and not a depth.
# dropped icon: untyped light — the vocabulary has five specific light values and no generic one
# `discontinued` is not written by hand (D59); availability.ts measures it.

series:
  id: prt-40
  name: PRT-40
  line: pro-trek
  aka: ['TRIPLE SENSOR']

models:
  - id: prt-40
    ref: PRT-40
    source: { url: 'http://www.digital-watch.com/DWL/1work/casio-prt-40', kind: community }
    module: '1470'
    case: { material: resin }
    features: [alarm, stopwatch, compass]
    image: prt-40
    image_credit:
      author: 'The Digital Watch Library'
      licence: rights-reserved
      url: 'http://www.digital-watch.com/DWL/1work/casio-prt-40'
    discontinued: true
