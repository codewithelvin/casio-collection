    ref: G-9000BP-1
    source: { url: 'https://www.javys.com/casio/new_web/watch/new_watch.php?id=G-9000BP-1', kind: retailer }
    image: g-9000bp-1
    image_credit:
      author: Javys
      licence: rights-reserved
      url: 'https://www.javys.com/casio/new_web/watch/new_watch.php?id=G-9000BP-1'

