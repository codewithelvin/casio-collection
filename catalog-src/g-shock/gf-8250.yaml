# PHOTOGRAPHS REFUSED, 4 of them, and this is the reason for every
# `image: null` below that does not carry one of its own.
#
# These references are discontinued collaborations and regional limited runs.
# Every route this project knows how to walk was walked, and the measurement is
# recorded rather than the hope:
#
#   * Casio's own archived product pages (D52) — only 7 of 384 G-SHOCK gaps had
#     an archived page in ANY of 32 locales, and 3 of those named no asset.
#     Extending the crawl to `mea-en`, `africa-fr` and `at` added 1 833 pages
#     and zero new references.
#   * four Shopify rosters dumped in full — shopcasio.fjbl.co.id, watchoutz.com,
#     ippojapanwatch.com and casio.ge, 5 000+ listings between them.
#   * `/search/suggest.json?q=<REF>` asked for EVERY one of these references
#     individually across those shops. Zero hits beyond the roster dumps, so the
#     route is exhausted rather than untried.
#   * gshock.casio.com, g-shock.jp and world.g-shock.com in the archive — 14 330+
#     product URLs, but they are *series* pages and their images are AEM
#     renditions: banners, 4:3 lifestyle crops and wrist shots. Not card images.
#
# So this is D29's typographic tile as a deliberate primary state, not an
# oversight. What would change it is a source nobody here has: the client's own
# photography, or a licensed pool. A wrist shot, a lifestyle photo or a listing
# collage would not — those are refused on quality, not availability.
#
# Measured 2026-08-24, re-checked 2026-08-26 against the page cache.
# GF-8250 — the Frogman, seeded 2026-08-17 (M9), from module 3266's guide.
#
# `movement: solar` AND NOT `solar-radio`, WHICH IS THE READING THAT MATTERS
# HERE. Module 3266's guide and module 3184's are near-identical documents — the
# same diving functions, the same tide and moon rows, the same illumination
# line. What 3266's table does not have is the "Time Calibration Signal
# Reception" row. Its power supply is a solar cell and nothing more. Two Frogmen
# that look the same on the page and are two different watches.
#
# The diving-log function is stated here too, and there is still no vocabulary
# value for it. Proposed in the summary, absent here (guardrail 4).
#
# THE SOURCE IS THE MODULE MANUAL (D44). casio.com answers 403 to every product
# path on every locale, but serves the operation guides from its /content/dam/
# CDN, and §10.6 counts a manual page as `official`. Every field below is read
# off the Specifications block of the module 3266 guide named in `source`.
#
# WHICH REFERENCES USE MODULE 3266 is the one fact the manual does not carry.
# That list comes from ShockBase's module index, which states in so many words
# "These are all watches with module 3266":
#   https://shockbase.org/watches/modules_dyn.php?module=3266
# The roster is provenance for the *identity* of these models; every *field* on
# them comes from the manual. That distinction is what keeps this inside the
# one-page rule rather than merging two sources into one entry.
#
# COLLABORATION REFERENCES ARE LEFT OUT. The index lists collaborations under
# strings that are community constructions rather than references — a doubled
# hyphen, or a collaborator's name appended to a reference that ends before it.
# D2 makes an id permanent and the sourcing rule says a model whose sources
# disagree on the reference itself is not written at all.
#
# SOME PHOTOGRAPHS COME FROM A STOCKIST'S LISTING, and each says which (D53).
# Every *field* above is still read off the module manual named in `source`.
# Where `image_credit` names a shop rather than Casio, that reference has no
# archived casio.com product page — it is a collaboration, a regional edition,
# or too recent to have been captured — so the photograph is read off the
# listing page the credit points at, never a path derived from the reference.
# Those files are `rights-reserved` and used under D11: non-commercial,
# attributed, withdrawn in full on request.
#
# DELIBERATELY NOT WRITTEN, and each absence is a real one:
#   * `year` — the manual dates the module, never the reference (D25).
#   * `case` and `water_resistance_m` — properties of the watch, not the module.
#   * `colorway` — the reference suffix encodes it and decoding it is a guess.
#   * `shock-resistant` — it is what G-SHOCK means and the manual does not say
#     it. Writing it here would be the catalogue asserting something on Casio's
#     behalf, which is the one thing FR-10.4 rules out.
#   * `image` — D41 needs a licence and a proof it is the right watch.

