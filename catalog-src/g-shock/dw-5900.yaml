# DW-5900 -- the reference and the photograph come from Casiold
# (casiold.com); every SPECIFICATION below was read from the Digital Watch
# Library on 2026-08-31, which is where this entry now points.
#
# TWO PAGES, AND THE ENTRY SAYS WHICH SAID WHAT. `source` is the DWL page
# because every field comes from it. The photograph is still the dealer's and
# its `image_credit` still names the dealer -- the credit travels with the
# file (D41), which is how one entry cites two pages without merging them.
#
# The dealer's date agrees with this page for once -- casiold titles it
# "1992 Casio DW-5900" -- but the year below is still read from
# here, because agreeing is not the same as being a source.
#
# Read BY DIV ID, never by position. Stripping this page's tags and taking
# the values in order puts the BRACELET row last before the year, and it
# looks exactly like a casing material -- the casing above came from
# #case1 and nothing here was read off the end of a list.
#
# DELIBERATELY ABSENT: `display` -- no row states it, and reading it off the
# photograph is what D27 forbids.
# `movement` -- no row and no icon states how it is driven.
# `discontinued` is not written by hand (D59); availability.ts measures it.

