# GW-M5610 — seeded 2026-08-17 (M2b), the first G-SHOCK series in the catalogue
# and the first entries anywhere in it sourced from an **official** Casio page.
#
# THE SOURCE IS THE MODULE MANUAL, and that needs explaining because it is not
# a product page. casio.com answers 403 to every product path on every locale
# (Akamai bot protection — a browser user agent does not help, which is how the
# earlier "connection reset" reading was wrong). What casio.com does serve, on
# its /content/dam/ CDN path, is the operation guides — and §10.6 is explicit
# that `official` includes "a support/manual page". So every field below is read
# off the Specifications block of the module manual named in `source`.
#
# WHICH REFERENCES USE MODULE 3159 is the one fact the manual does not
# carry. That list comes from ShockBase's module index, which states in so many
# words "These are all watches with module 3159":
#   https://shockbase.org/watches/modules_dyn.php?module=3159
# The roster is provenance for the *identity* of these models; every *field* on
# them comes from the manual. That distinction is what keeps this inside the
# one-page rule rather than merging two sources into one entry.
#
# THE PHOTOGRAPHS COME FROM A DIFFERENT CASIO PAGE, and each one says so (D53).
# Every *field* above is still read off the module manual named in `source`;
# the photograph is read off Casio's own archived product page for that exact
# reference (D52), which is what `image_credit.url` points at. The file itself
# is served live by casio.com from the `/content/dam/` path that page names —
# never a path derived from the reference, which is the whole of D41.
#
# NOT EVERY ENTRY HERE HAS ONE, and the ones without are not waiting on effort.
# The archive holds Casio's product page for some of these references and not
# others; an entry with no `image` is one whose page was never captured, or
# whose capture names no asset for it. The typographic card is the state for
# those, and it is a primary state rather than a fallback (D29).
#
# THE PHOTOGRAPHS COME FROM A DIFFERENT CASIO PAGE, and each one says so (D53).
# Every *field* above is still read off the module manual named in `source`;
# the photograph is read off Casio's own archived product page for that exact
# reference (D52), which is what `image_credit.url` points at. The file itself
# is served live by casio.com from the `/content/dam/` path that page names —
# never a path derived from the reference, which is the whole of D41.
#
# NOT EVERY ENTRY HERE HAS ONE, and the ones without are not waiting on effort.
# The archive holds Casio's product page for some of these references and not
# others; an entry with no `image` is one whose page was never captured, or
# whose capture names no asset for it. The typographic card is the state for
# those, and it is a primary state rather than a fallback (D29).
#
# DELIBERATELY NOT WRITTEN, and each absence is a real one:
#   * `year` — the manual dates the module, never the reference. Guessing a
#     release year from a module is exactly what D25 forbids.
#   * `case` and `water_resistance_m` — properties of the watch, not the module.
#     200 m is true of every square ever made and it is still not on this page.
#   * `colorway` — the reference suffix encodes it and decoding it is a guess.
#   * `shock-resistant` — it is what G-SHOCK means and the manual does not say
#     it. Writing it here would be the catalogue asserting something on Casio's
#     behalf, which is the one thing FR-10.4 rules out.
#
# The 3159 guide is an older MO-format PDF whose Specifications block did not
# survive extraction, so the features here are the MODES the manual documents
# and nothing beyond them. No backlight tag: the guide describes one and does
# not name the technology, and EL and LED are different parts.
#
# `movement: solar-radio` rather than a `radio-controlled` feature as well —
# the vocabulary is explicit that solar-plus-radio is one value, not two.

