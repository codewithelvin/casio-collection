# GBD-200 — refreshed 2026-09-10 from Casio's own
# product pages, retrieved from the Internet Archive (D52), replacing the
# 2026-09-09 javys.com stub. Every field on every entry below, and every
# photograph, comes from the one page named in its `source`; GBD-200LM-1's
# `source` now points at that page instead of javys, which stated far less.
#
# DELIBERATELY NOT WRITTEN:
#   * `year` — no captured page dates the reference (D25).
#   * `colorway` — this template names no colour in words anywhere on the
#     page; only a swatch photograph and the other references' own
#     `color-variation` assets, which are a different model's picture.
#   * `display` — every GBD-200 is in fact digital, but no captured page
#     states "Digital:"/"Analog:" in the Timekeeping row this reader looks
#     for (sources.md — "the guide talks about hands is not a statement"),
#     so this is left for a page that does say it.
#   * `module` — no captured page carries a "Module No." row.
#   * `family` — a judgement about how a watch looks, and a human's to make.
#   * any field the page does not state. Absent means unknown, never zero (D27).
#
# GBD-200-1A1's only archived capture is German (`de`); the case-size,
# material and glass rows this reader knows are English-labelled, so only
# `movement` (via the language-independent CR2032 battery code) and the
# loanwords "Alarm", "Bluetooth" and "(Super Illuminator)" came through.
# Sparse and honest rather than dropped (sources.md).
#
# GBD-200RD-4CG is a US "with Powerbank" bundle SKU with its own archived
# page (dated 01/2023 on the page itself), whose only images are the gift
# power bank and GBD-200RD-4's own photograph reused wholesale — not a
# photograph of this SKU, so `image` stays null rather than borrowing one
# reference's picture for another's entry.

