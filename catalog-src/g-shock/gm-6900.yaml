# ADDED 2026-08-29: 1 reference named by hand, because
# D47's discovery filter refuses it.
#
# Each is listed in Casio's OWN CURRENT SITEMAP, which is Casio stating that the
# reference exists (D48) — a stronger claim about identity than any shape rule,
# and the only identity `seed-refs.ts` accepts. `roster.ts`'s `CANONICAL_REF`
# requires a suffix beginning with a digit. That filter governs what a CRAWL may
# turn into a permanent id unsupervised, and it is not a claim that the
# reference is fake — D47 as revised on 2026-08-19 (O13, closed) names the
# references it knowingly refuses, and says admitting them "stays a separate
# decision". Naming a reference Casio itself lists needs no decision at all,
# so that is what happened here, and `roster.ts` is untouched.
#
# Every field below comes from the one archived Casio product page named in its
# `source` (D52), read by the same reader as the rest of this file. No `year`:
# a product page dates nothing (D25). No `discontinued`: that is measured over
# the whole catalogue by `availability.ts` (D59), never written by hand.
  - id: gm-6900wtc22-9
    ref: GM-6900WTC22-9
    source:
      { url: 'https://web.archive.org/web/20230223195533id_/https://www.casio.com/us/watches/gshock/product.GM-6900WTC22-9/', kind: official }
    movement: quartz
    case: { height_mm: 53.9, width_mm: 49.7, depth_mm: 18.6, weight_g: 96, material: 'Resin / Stainless steel' }
    water_resistance_m: 200
    features: [alarm, stopwatch, countdown-timer, full-auto-calendar, hourly-time-signal, el-backlight, afterglow, shock-resistant, mineral-glass, flash-alert]
    discontinued: false
    # NO PHOTOGRAPH, AND SOMEBODY LOOKED. The one archived capture of this page
    # names no image of this reference at all — `backfill-photos.ts g-shock
    # --crawl` re-read it on 2026-08-29 and reported "the page names no
    # photograph of this reference", the only such page in the whole g-shock
    # line. Deriving `GM-6900WTC22-9.png` from the DAM is exactly the trap the
    # skill names: on A159 that route served a file byte-identical to a
    # different reference's, and no diff review would have caught it. The `World
    # Tour Collection` sibling shots on the page are of other references and
    # naming one here would claim a watch this is not.
    image: null
