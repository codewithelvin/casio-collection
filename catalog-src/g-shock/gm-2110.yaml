# GM-2110 — seeded 2026-08-17 (M9), on the same module as GA-2100.
#
# THE SOURCE IS THE MODULE MANUAL (D44). casio.com answers 403 to every product
# path on every locale, but serves the operation guides from its /content/dam/
# CDN, and §10.6 counts a manual page as `official`. Every field below is read
# off the Specifications block of the module 5611 guide named in `source` — the
# same guide, and the same reading, already reviewed for GA-2100 in M2b.
#
# WHICH REFERENCES USE MODULE 5611 is the one fact the manual does not carry.
# That list comes from ShockBase's module index, which states in so many words
# "These are all watches with module 5611":
#   https://shockbase.org/watches/modules_dyn.php?module=5611
# The roster is provenance for the *identity* of these models; every *field* on
# them comes from the manual. That distinction is what keeps this inside the
# one-page rule rather than merging two sources into one entry.
#
# COLLABORATION REFERENCES ARE LEFT OUT, and that is not squeamishness. The
# index lists collaborations under strings that are community constructions
# rather than references — a doubled hyphen, or a collaborator's name appended
# to a reference that ends before it. D2 makes an id permanent and the sourcing
# rule says a model whose sources disagree on the reference itself is not
# written at all. The filter keeps the shape Casio prints: prefix, number, a
# variant of at most four letters, one suffix.
#
# `family: octagonal`, DECIDED BY THE CLIENT 2026-08-17 rather than assumed here.
# Guardrail 4a reserves the family for a person, and GM-2110 being the GA-2100
# case in another material is exactly the judgement it means. The client’s rule is
# that a category of one is worse than no category — which is also what §10.2
# check 4 warns about, and `octagonal` held only ga-2100 until now.
#
# DELIBERATELY NOT WRITTEN, and each absence is a real one:
#   * `year` — the manual dates the module, never the reference (D25).
#   * `case` and `water_resistance_m` — properties of the watch, not the
#     module. 200 m is true of every one of these and it is still not on this
#     page.
#   * `colorway` — the reference suffix encodes it and decoding it is a guess.
#   * `shock-resistant` — it is what G-SHOCK means and the manual does not say
#     it. Writing it here would be the catalogue asserting something on Casio's
#     behalf, which is the one thing FR-10.4 rules out.
#   * `image` — D41 needs a licence and a proof it is the right watch.

series:
  id: gm-2110
  name: GM-2110
  line: g-shock
  family: octagonal
  aka: [GM2110]

models:
