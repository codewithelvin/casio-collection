# DW-8800 — the Codename, seeded 2026-09-08 from ShockBase, which is the first
# time a photograph in this catalogue has come from there.
#
# THIS FILE EXISTS BECAUSE D74 WAS REVISED A SECOND TIME, by the client on
# 2026-09-08. D74's field half was withdrawn on 2026-09-07; the photograph half
# stood until today, and it is what had kept this series out. O20 asked whether
# to write fourteen references nobody could see, was **answered no on
# 2026-09-08**, and its row was left open with the reason recorded: it was
# waiting on a photograph route rather than on a decision. This is that route.
#
# The argument that moved it is one D74 never engaged with. D74 refused a
# ShockBase photograph because ShockBase's own disclaimer says the pictures are
# Casio's and "a republisher cannot grant a licence it does not hold" — which is
# true, and is **equally true of `web.archive.org`**, the republisher roughly
# three thousand of this catalogue's photographs come through. Both are Casio's
# product photography reached via a third party and used under D11:
# non-commercial, attributed, withdrawn in full on request. The credit below is
# byte-for-byte the shape every archive-sourced entry already carries.
#
# `src/catalog/shockbase.ts` STILL MAY NOT EMIT AN IMAGE PATH and its test still
# asserts so. Nothing here went through it: `shockbase-enrich.ts` enriches
# entries that exist and deliberately creates no ids, so every entry in this
# file was written by hand and every photograph was fetched by URL. That test is
# not weakened by this file and should not be.
#
# EVERY FIELD CAME OFF THE ONE PAGE NAMED IN `source`, read by the repo's own
# parser (`shockbase-enrich.ts probe`) rather than by a new reader. That page
# states specifications about the reference itself, so §10.6's one-page rule is
# satisfied outright and no `year_source` is needed — the year is on the same
# page as everything else, which is why D54's per-field citation is absent here
# and present on the entries whose years came from a page their fields did not.
#
# THE MINIMAL URL IS A 200 THAT MEANS NO. `watch_dyn.php?model=<REF>` without
# `subseries` and `series` serves half a page: every field reads empty while the
# response looks healthy. All three parameters are in every URL below.
#
# THE PHOTOGRAPHS ARE FULL SIZE AND THE PAGE DOES NOT LINK THEM THAT WAY. Each
# page's `<img>` names `<REF>_medium.webp`, and every one of those is **exactly
# 300 px wide** whatever its height — at §10.3's floor, so it would be upscaled
# to make the 400 px file. Dropping the `_medium` and asking for `<REF>.png`
# answers 200 at 500 x 600 for the module-1444 references and at 321–962 px for
# module 1443. That is the same move Casio's own DAM allows and it is a size
# variant of a file the page named, not a derived path to a different asset.
# Better still, the page *links* the full-size `.png` in an `href` beside the
# thumbnail, so on this site it is not even a variant — it is a file the page
# names outright. Exactly one reference does not benefit; see `AB-9T` below.
#
# IDENTITY IS PROVEN TWICE OVER for all twenty. Each filename carries its own
# reference with a boundary after it, and each was reached from that reference's
# own page. Then the colour ShockBase states was checked against the picture —
# for the first six by eye off the downloads, for the fourteen added on
# 2026-09-08 by building one labelled contact sheet of all fourteen against the
# fourteen stated colourways and reading it in a single pass. Every one is a
# DW-8800 with CODENAME printed on the dial, and every stated colour matches:
# AB-9T's yellow strap, B-1V black, B-2V and BJ-2 blue, B-4V and BJ-4 red,
# B-8V/B-8BV/BJ-8 grey, the MJ and MM pair multi. Every dial prints WATER 20BAR
# RESIST, which is the 200 m the pages state.
#
# THE CONTACT SHEET IS THE CHEAP VERSION OF A CHECK NOBODY DOES. Fourteen
# photographs read one at a time is fourteen chances to lose track of which
# reference is on screen; one sheet with each reference and its stated colour
# printed under its own tile is a single comparison, and a mismatch is
# impossible to skim past. It cost one script.
#
# THE SERIES IS NOW COMPLETE AT TWENTY REFERENCES, all twenty photographed, and
# the six it gained beyond O20's count say something about the roster rather
# than about the watches. O20 counted fourteen, from ShockBase's sitemap. The
# eight that count was missing were fetched on 2026-09-08 and are below. So are
# six more: `DW-8800AB-9T`, which the sitemap does list, and `DW-8800B-1V`,
# `-2V`, `-4V`, `-8BV` and `-8V`, which it does not list at all.
#
# THE MODULE STRIP IS THE ENUMERATOR AND THE SITEMAP IS NOT. There is no listing
# page for a subseries — `subseries_dyn.php` without a `model` answers 200 with
# a generic page and links no references whatsoever, another 200 that means no.
# What enumerates is the thumbnail strip on a model page, and it is **per
# module**: every module-1444 page links the same fourteen references and every
# module-1443 page links the same six. The two sets are disjoint, they sum to
# twenty, and each page's strip agrees with every other page's in its module —
# which is what makes twenty an assertion rather than a guess.
# `Resources/rosters/shockbase-sitemap-uncatalogued.tsv` holds fifteen of the
# twenty, so **ShockBase's sitemap is incomplete, and a roster walk over it
# reports a finished series that is not one.** Ask a model page, not the map.
#
# THE TWO MODULES DIFFER IN WHAT THEIR PAGES STATE, so the entries differ too.
# Module 1444 states a 64 g weight; module 1443 states none — except `AB-9T`,
# whose page does state it. Nothing was carried across from a sibling: five
# entries below have no `weight_g` because five pages print no weight.
#
# ONE PHOTOGRAPH SITS EXACTLY ON §10.3's FLOOR, AND IT IS `AB-9T`. Its full-size
# `.png` is **254 x 338** — under the 300 px floor, and refused on its own. Its
# `_medium.webp` is **larger**, at **300 x 399**: the size ladder runs backwards
# for this one reference, and four larger variants were probed and all 404, so
# the medium is the best that exists. 300 px is not *under* 300 px, so it is
# published, and it is the only file here that will be upscaled to make the
# 400 px render — `catalog:images` names it for that on every run. The rule's
# stated reason weighs a soft photograph against §8.6's typographic tile, and
# since D63 that is no longer the alternative: a watch with no photograph is in
# no grid at all, so the real comparison is against invisibility.
#
# DELIBERATELY NOT WRITTEN:
#   * `shock-resistant`, on a G-SHOCK. ShockBase has no row for it — it is
#     implicit for every watch on the site — and an unstated field is absent
#     rather than denied (D27, rule 2). It is not read off the dial print either,
#     which is exactly what D83 forbids.
#   * `data_memory` and `low_temp_resistance`, which all six pages state. Both
#     are already in `KNOWN_UNMAPPED`, so the vocabulary has deliberately never
#     had a word for them; rule 4 forbids a seeding run inventing one. Reported.
#   * `nickname`. Every page states one — *Codename* — and the schema has no
#     field for it. That is the open schema question, and it stays open.
#   * `family` — a human's judgement, never a seeding run's.
#   * `discontinued` — measured for the whole catalogue by `availability.ts`
#     (D59), never written by hand.

