# §14.3 — every step before deploy-pages is a gate.
#
# A failing test or a coverage floor breach (D31) stops the deploy exactly as a
# type error does. There is deliberately no "deploy anyway" path: the one time
# it would be used is the time it shouldn't be.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A queued deploy is superseded by a newer one, but a running deploy is never
# cancelled — a half-published Pages site is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # The whole history, not the default single commit — the sitemap's
      # <lastmod> for each of 3 500 URLs is the commit date of the catalogue
      # file behind it (scripts/lib/lastmod.ts). On a shallow clone git reports
      # the one fetched commit as the last change to every file in the
      # repository, so the step detects that and emits no dates at all rather
      # than telling every crawler that the entire site changed this morning.
      # A green deploy with a dateless sitemap is the failure mode this avoids,
      # and it is invisible without this line.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # No actions/configure-pages step. It was tried with enablement:true to
      # save a manual setting and it fails: the default GITHUB_TOKEN cannot
      # create a Pages site, and because the step runs first it took the whole
      # build down with it. Pages is enabled once, by hand, at
      # Settings -> Pages -> Source: GitHub Actions. Nothing here needs the
      # action's outputs — the base path is fixed by D13, not discovered.
      # The catalogue pipeline is TypeScript run directly by Node, so that the
      # build and the browser share one Zod schema (§6.2). Native type stripping
      # needs Node 22.18 or later; 24 is what it is developed against.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # D31 — the coverage floor on the pure-logic modules is enforced here and
      # is not lowerable. Raising it is fine; lowering it costs a decision in §0.
      - name: Unit tests and coverage gate
        run: npm run test:coverage

      # §10.2 — every integrity check is a build failure, and this is where that
      # becomes true of the deploy too. It runs ahead of the Vite build because
      # public/catalog/catalog.json is a build artefact rather than a committed
      # file, and Vite copies public/ into dist as it goes.
      - name: Catalogue build
        run: npm run catalog:build

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          # D68 — a repository **variable**, not a secret: the measurement ID
          # ships in the bundle and identifies a property rather than
          # authorising anything, and marking it secret would only hide from the
          # next maintainer that it is public. Unset means no analytics and no
          # CSP grant, which is the correct state for a fork.
          VITE_GA_ID: ${{ vars.VITE_GA_ID }}

      # NFR-3 / D28 — 380 KB gzipped. `npm run build` has already copied
      # index.html to 404.html (D13); this reads the entry graph out of it.
      - name: Bundle budget
        run: npm run budget

      - name: Verify the SPA fallback exists (D13)
        run: test -f dist/404.html

      # The gate the prerender step never had: crawl the artefact the way a
      # search engine crawls the site — resolving paths the way GitHub Pages
      # does, obeying the generated robots.txt, following links out of the
      # served HTML — and fail on anything that loses a page. A link to nothing,
      # a sitemap URL nothing links to, a page that is noindex and advertised
      # anyway, a page with no title.
      #
      # Every check here exists because the artefact could satisfy every other
      # step in this job and still not be crawlable: 389 orphaned sitemap URLs
      # shipped once with the whole suite green, and were found by somebody
      # crawling the live site months later.
      - name: Crawl the artefact
        run: npm run crawl

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # §13.3 — the proof behind D14, run against a real disposable project (§14.5).
  #
  # A separate job rather than a step in `build`, and deliberately **not** a gate
  # on the deploy. What it tests is the database, which is already live and
  # already enforcing whatever it enforces; blocking a front-end deploy on it
  # would neither fix a bad policy nor protect anyone from one. It fails loudly,
  # and it blocks M7 — which is where §13.3 genuinely is a launch blocker.
  #
  # It skips green with a ::warning:: until the CI project exists. D42 records
  # why that project keeps email/password sign-up on when production does not:
  # the alternative is putting the service-role key into CI, and that is the one
  # key that bypasses every policy this job exists to prove.
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Row level security (§13.3)
        run: npm run test:rls
        env:
          SUPABASE_CI_URL: ${{ vars.SUPABASE_CI_URL }}
          SUPABASE_CI_ANON_KEY: ${{ vars.SUPABASE_CI_ANON_KEY }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      # §14.3 — request a deep link directly and fail the job on a real 404.
      # This is the failure mode that is invisible in local development, where
      # Vite's dev server rewrites for free. Without this step, D13 breaking is
      # something a visitor discovers by refreshing a shared link.
      # The status code is NOT the thing to assert here, and the first version
      # of this step got it wrong. GitHub Pages serves a custom 404.html with
      # its *body* but keeps the **404 status** — that is the mechanism, not a
      # fault. A deep link therefore returns 404 while working perfectly: the
      # browser loads the shell, the router reads the path, and the right route
      # renders. Asserting 200 can never pass on Pages.
      #
      # What proves D13 is that the response body is our app shell rather than
      # GitHub's generic "There isn't a GitHub Pages site here" page. If the
      # 404.html copy ever stops happening, this body check is what catches it.
      #
      # The asset check reads `src="/assets/` rather than a project path: D39
      # moved the site to the root of casiovault.com. It stays anchored on the
      # leading slash so it still proves Vite substituted a base into the shell,
      # which is the half of D13 that a bare `assets/` would stop proving.
      - name: Smoke test a deep link
        run: |
          url="${{ steps.deployment.outputs.page_url }}watch/ga-2100-1a1"
          echo "GET $url"
          for attempt in 1 2 3 4 5; do
            response=$(curl -sS -L -w '\n%{http_code}' "$url" || true)
            code=$(printf '%s' "$response" | tail -n1)
            body=$(printf '%s' "$response" | sed '$d')
            if printf '%s' "$body" | grep -q 'id="root"' \
               && printf '%s' "$body" | grep -q 'src="/assets/'; then
              echo "attempt $attempt: HTTP $code, app shell served — SPA fallback works"
              exit 0
            fi
            echo "attempt $attempt: HTTP $code, body is not the app shell"
            sleep 10
          done
          echo "The deep link did not return the app shell — the 404.html SPA fallback is broken (D13)."
          exit 1
